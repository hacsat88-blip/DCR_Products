# Scoring 5-Axis — 共通5軸スコア定義
# screener / analyst が銘柄評価時に使用する。
# ★は「監視候補度」であり、売買推奨ではない。

axes:
  A_price_range:
    label: "値動き余地"
    weight: 0.25
    scale: 1-5
    sources: ["[W]"]
    evaluate:
      - 直近レンジ内の位置（上限/下限/中間）
      - サポート・レジスタンスの強度
      - ボラティリティ（ATR・β）
      - 過去の同条件からの騰落率

  B_volume_demand:
    label: "出来高・需給"
    weight: 0.20
    scale: 1-5
    sources: ["[W]"]
    evaluate:
      - 出来高トレンド（増加/減少/横ばい）
      - 売買代金（流動性の十分さ）
      - 信用倍率（JP）/ Short Interest（US）
      - 機関投資家の動向

  C_catalyst_theme:
    label: "材料・テーマ"
    weight: 0.20
    scale: 1-5
    sources: ["[E]", "[W]"]
    evaluate:
      - 直近の業績修正・上方修正
      - 政策テーマ（AI・脱炭素・防衛等）との連動性
      - 決算発表の近接性
      - 中計・IR更新の内容

  D_fundamentals:
    label: "ファンダメンタル"
    weight: 0.20
    scale: 1-5
    sources: ["[E]優先", "[W]"]
    evaluate:
      - 売上成長率・営業利益率
      - PER / PBR / PSR の割安性
      - ROE / ROA
      - 財務健全性（自己資本比率・CF）
      - 配当利回り・株主還元
    note: "[E]が取れない場合は推定軸扱い"

  E_risk_resilience:
    label: "リスク耐性"
    weight: 0.15
    scale: 1-5
    sources: ["[E]", "[W]"]
    evaluate:
      - 財務悪化リスク（純資産マイナス・CF赤字）
      - 希薄化リスク（新株・転換社債等）
      - 急落リスク（材料剥落・需給悪化）
      - セクター固有リスク

normalization:
  formula: "Σ(軸点数 × 重み) / 5 × 100"
  output_range: 0-100

star_mapping:
  5: { min: 85, label: "★5" }
  4: { min: 70, label: "★4" }
  3: { min: 55, label: "★3" }
  2: { min: 40, label: "★2" }
  1: { min: 0,  label: "★1" }

uncertainty_rules:
  estimated_axes_1_2:
    action: "⚠️推定軸N個 を付けて候補に残す"
  estimated_axes_3_plus:
    action: "「要追加確認」枠に降格"
  D_axis_no_edinet:
    action: "推定軸扱い（D軸に⚠️）"
  low_liquidity:
    action: "⚠️流動性リスク を付与"
  unavailable:
    action: "Scoring停止・除外枠へ"
