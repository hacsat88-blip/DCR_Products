# Predefined Skill Compositions
# Standard workflow chains the skill-router references when detecting multi-step intent.
# Operators: → (sequence), || (parallel), ?: (conditional)

compositions:

  # Full feature development pipeline
  feature-pipeline:
    description: "機能開発の完全パイプライン（設計→計画→実装→検証）"
    chain: "brainstorming → writing-plans → [implementation] → verification-before-completion"
    trigger_hint: "新機能の開発、機能追加"
    type_flow: "intent → spec → spec → code → report"

  # Code quality pipeline
  quality-pipeline:
    description: "コード品質パイプライン（レビュー→修正→検証）"
    chain: "code-review → systematic-debugging → verification-before-completion"
    trigger_hint: "コード品質改善、レビュー後修正"
    type_flow: "code → review → code → report"

  # Debug-to-verify pipeline
  debug-verify:
    description: "バグ修正パイプライン（調査→修正→検証）"
    chain: "systematic-debugging → verification-before-completion"
    trigger_hint: "バグ修正、テスト失敗の解決"
    type_flow: "code → code → report"

  # Planning pipeline
  plan-pipeline:
    description: "計画パイプライン（ブレスト→計画策定）"
    chain: "brainstorming → writing-plans"
    trigger_hint: "設計相談、計画立案"
    type_flow: "intent → spec → spec"

  # Review with adversarial challenge
  adversarial-review:
    description: "対抗レビューパイプライン（レビュー || セキュリティチャレンジ）"
    chain: "code-review || [security-challenge]"
    trigger_hint: "セキュリティを含む厳格なレビュー"
    type_flow: "code → review + review"

  # TDD feature development
  tdd-feature:
    description: "TDD機能開発（設計→TDD→検証）"
    chain: "brainstorming → writing-plans → tdd-workflow → verification-before-completion"
    trigger_hint: "テスト駆動での新機能開発"
    type_flow: "intent → spec → spec → code → report"
