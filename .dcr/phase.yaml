# DCR Temporal Skill Context — Phase Profiles
#
# Controls skill activation priority based on project phase.
# skill-router reads this file to apply boost/suppress modifiers
# to candidate scoring.
#
# Usage:
#   1. Set current_phase to match your project state
#   2. skill-router applies boost (+3) and suppress (-3) modifiers
#   3. restrict_to_p3 escalates all matching operations to P3 approval
#
# Phase detection heuristics (optional, model-assisted):
#   - Branch name contains "release/" or "hotfix/" → release-prep
#   - Sprint board shows > 80% done → sprint-end
#   - No open PRs + fresh sprint → sprint-start
#   - Tag "code-freeze" exists on HEAD → code-freeze

current_phase: sprint-mid

phase_profiles:
  sprint-start:
    description: "スプリント開始 — 計画・設計フェーズ"
    boost:
      - writing-plans
      - brainstorming
      - prd-to-issues
      - search-first
    suppress:
      - finishing-a-development-branch
      - verification-before-completion

  sprint-mid:
    description: "スプリント中盤 — 実装フェーズ（デフォルト）"
    boost:
      - tdd-workflow
      - systematic-debugging
      - code-review
    suppress: []

  sprint-end:
    description: "スプリント終盤 — レビュー・完了フェーズ"
    boost:
      - code-review
      - verification-before-completion
      - finishing-a-development-branch
      - eval-harness
    suppress:
      - brainstorming
      - prd-to-issues

  release-prep:
    description: "リリース準備 — 品質確保フェーズ"
    boost:
      - verification-before-completion
      - security-scan
      - eval-harness
      - code-review
    suppress:
      - brainstorming
      - writing-plans

  code-freeze:
    description: "コードフリーズ — 緊急修正のみ"
    boost:
      - systematic-debugging
      - security-scan
      - verification-before-completion
    suppress:
      - brainstorming
      - writing-plans
      - prd-to-issues
    restrict_to_p3:
      - all-edit-operations

  hotfix:
    description: "ホットフィックス — 最小変更で最速修正"
    boost:
      - systematic-debugging
      - verification-before-completion
      - tdd-workflow
    suppress:
      - brainstorming
      - improve-codebase-architecture
      - prd-to-issues

  exploration:
    description: "探索・PoC — 自由度を最大化"
    boost:
      - brainstorming
      - search-first
      - rapid-prototyper
    suppress:
      - code-review
      - eval-harness

# Modifier values (applied to weighted scoring):
#   boost: +3 to candidate score
#   suppress: -3 to candidate score
#   restrict_to_p3: escalates permission tier to P3
