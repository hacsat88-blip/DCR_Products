# 配布地図: source(正本) -> entrypoint(生成物) / mirror(生成物)
# validate.ps1 はこの配布契約と deploy 実装の完全一致を検証する。
version: 1
sources:
  core: .ai/core
  routing: .ai/routing
  catalog: .ai/catalog
  adapters: .ai/adapters
entrypoints:
  - tool: claude-code
    out: CLAUDE.md
    adapter: .ai/adapters/claude-code/kernel.md
    reads: [core, routing, catalog]
  - tool: codex
    out: AGENTS.md
    adapter: .ai/adapters/codex/kernel.md
    reads: [core, routing, catalog]
  - tool: cursor
    out: .cursor/rules/dcr-kernel.mdc
    adapter: .ai/adapters/cursor/kernel.md
    reads: [core, routing, catalog]
mirrors:
  - source: .ai/catalog/agents-source
    out: .claude/agents
    generated: true
  - source: .ai/catalog/agents-source
    out: .codex/agents
    generated: true
