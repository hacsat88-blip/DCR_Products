<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* ─── Theme Variables ───────────────────────────────────── */
    :root {
      --bg:          #020617;
      --bg2:         #0f172a;
      --bg3:         #1e293b;
      --text:        #f1f5f9;
      --text2:       #94a3b8;
      --border:      #334155;
      --grid-col:    rgba(255,255,255,0.028);
      --shadow:      rgba(0,0,0,0.6);
      --card-bg:     rgba(15,23,42,0.85);
      --btn-bg:      #1e293b;
      --btn-hover:   #334155;

      --c-frontend:  #06b6d4;
      --c-backend:   #10b981;
      --c-database:  #8b5cf6;
      --c-cloud:     #f59e0b;
      --c-security:  #f43f5e;
      --c-queue:     #f97316;
      --c-monitor:   #38bdf8;
      --c-external:  #64748b;
    }
    [data-theme="light"] {
      --bg:          #f8fafc;
      --bg2:         #f1f5f9;
      --bg3:         #ffffff;
      --text:        #0f172a;
      --text2:       #475569;
      --border:      #cbd5e1;
      --grid-col:    rgba(0,0,0,0.035);
      --shadow:      rgba(0,0,0,0.15);
      --card-bg:     rgba(255,255,255,0.92);
      --btn-bg:      #e2e8f0;
      --btn-hover:   #cbd5e1;
    }

    /* ─── Base ──────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans JP', 'JetBrains Mono', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ─── Header ────────────────────────────────────────────── */
    .header {
      padding: 28px 40px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--bg2);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .status-dot {
      width: 10px; height: 10px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulse 2.5s infinite;
      flex-shrink: 0;
      margin-top: 5px;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.4); }
      50%      { box-shadow: 0 0 0 6px rgba(34,197,94,0); }
    }
    .title-block h1 {
      font-size: 1.45rem;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }
    .title-block p {
      font-size: 0.82rem;
      color: var(--text2);
      margin-top: 4px;
      font-family: 'JetBrains Mono', monospace;
    }
    .header-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .ctrl-btn {
      background: var(--btn-bg);
      border: 1px solid var(--border);
      color: var(--text2);
      padding: 6px 13px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 0.78rem;
      font-family: 'JetBrains Mono', monospace;
      transition: all 0.15s;
      user-select: none;
    }
    .ctrl-btn:hover { background: var(--btn-hover); color: var(--text); }
    .ctrl-btn.active { background: var(--btn-hover); color: var(--text); }

    /* ─── Diagram Container ─────────────────────────────────── */
    .diagram-wrap {
      flex: 1;
      overflow: hidden;
      position: relative;
      background: var(--bg);
      background-image:
        linear-gradient(var(--grid-col) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-col) 1px, transparent 1px);
      background-size: 40px 40px;
      cursor: grab;
    }
    .diagram-wrap:active { cursor: grabbing; }
    .diagram-wrap svg {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 500px;
    }
    #diagram-group { transform-origin: 0 0; }

    /* ─── SVG Component Styles ──────────────────────────────── */
    .component { cursor: pointer; }
    .component rect {
      transition: filter 0.18s, stroke-width 0.18s;
      rx: 8px;
    }
    .component:hover rect { filter: brightness(1.35) drop-shadow(0 0 8px currentColor); stroke-width: 2.5; }

    .comp-frontend  { fill: rgba(6,182,212,0.14);  stroke: #06b6d4; stroke-width: 1.6; }
    .comp-backend   { fill: rgba(16,185,129,0.14); stroke: #10b981; stroke-width: 1.6; }
    .comp-database  { fill: rgba(139,92,246,0.14); stroke: #8b5cf6; stroke-width: 1.6; }
    .comp-cloud     { fill: rgba(245,158,11,0.14); stroke: #f59e0b; stroke-width: 1.6; }
    .comp-security  { fill: rgba(244,63,94,0.14);  stroke: #f43f5e; stroke-width: 1.6; }
    .comp-queue     { fill: rgba(249,115,22,0.14); stroke: #f97316; stroke-width: 1.6; }
    .comp-monitor   { fill: rgba(56,189,248,0.14); stroke: #38bdf8; stroke-width: 1.6; }
    .comp-external  { fill: rgba(100,116,139,0.14);stroke: #64748b; stroke-width: 1.6; }

    .comp-icon    { font-size: 14px; text-anchor: middle; dominant-baseline: auto; }
    .comp-label   { font-family: 'Noto Sans JP','JetBrains Mono',monospace; font-size: 11.5px; font-weight: 700; fill: #f1f5f9; text-anchor: middle; dominant-baseline: auto; }
    .comp-sublabel{ font-family: 'JetBrains Mono',monospace; font-size: 9.5px; font-weight: 400; fill: #64748b; text-anchor: middle; dominant-baseline: auto; }
    [data-theme="light"] .comp-label  { fill: #0f172a; }
    [data-theme="light"] .comp-sublabel { fill: #475569; }

    /* ─── Zone Styles ───────────────────────────────────────── */
    .zone-aws      { fill: rgba(245,158,11,0.04);  stroke: #f59e0b; stroke-width: 1.2; stroke-dasharray: 7 3; }
    .zone-gcp      { fill: rgba(59,130,246,0.04);  stroke: #3b82f6; stroke-width: 1.2; stroke-dasharray: 7 3; }
    .zone-azure    { fill: rgba(99,102,241,0.04);  stroke: #6366f1; stroke-width: 1.2; stroke-dasharray: 7 3; }
    .zone-k8s      { fill: rgba(16,185,129,0.04);  stroke: #10b981; stroke-width: 1.2; stroke-dasharray: 7 3; }
    .zone-security { fill: rgba(244,63,94,0.04);   stroke: #f43f5e; stroke-width: 1.2; stroke-dasharray: 7 3; }
    .zone-generic  { fill: rgba(100,116,139,0.04); stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 7 3; }
    .zone-label    { font-family: 'Noto Sans JP','JetBrains Mono',monospace; font-size: 11px; font-weight: 500; fill: #64748b; }

    /* ─── Arrow Styles ──────────────────────────────────────── */
    .arrow-frontend { stroke: #06b6d4; stroke-width: 1.6; fill: none; }
    .arrow-backend  { stroke: #10b981; stroke-width: 1.6; fill: none; }
    .arrow-database { stroke: #8b5cf6; stroke-width: 1.6; fill: none; }
    .arrow-cloud    { stroke: #f59e0b; stroke-width: 1.6; fill: none; }
    .arrow-security { stroke: #f43f5e; stroke-width: 1.6; fill: none; }
    .arrow-queue    { stroke: #f97316; stroke-width: 1.6; fill: none; }
    .arrow-monitor  { stroke: #38bdf8; stroke-width: 1.6; fill: none; }
    .arrow-external { stroke: #64748b; stroke-width: 1.6; fill: none; }
    .arrow-async    { stroke-dasharray: 6 3; }

    .arrow-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      fill: #64748b;
      text-anchor: middle;
      dominant-baseline: auto;
    }
    .arrow-label-side {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      fill: #64748b;
      text-anchor: start;
      dominant-baseline: auto;
    }
    [data-theme="light"] .arrow-label,
    [data-theme="light"] .arrow-label-side { fill: #475569; }
    [data-theme="light"] .zone-label { fill: #475569; }

    /* ─── Tooltip ───────────────────────────────────────────── */
    #tooltip {
      position: fixed;
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 10px 14px;
      font-size: 0.8rem;
      pointer-events: none;
      z-index: 100;
      max-width: 220px;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 24px var(--shadow);
      line-height: 1.5;
    }
    #tooltip strong { font-weight: 700; font-size: 0.85rem; display: block; margin-bottom: 3px; }
    #tooltip .tt-tech { color: var(--text2); font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; margin-bottom: 4px; }
    #tooltip .tt-desc { color: var(--text2); font-size: 0.78rem; }
    #tooltip .tt-badge {
      display: inline-block;
      padding: 1px 8px;
      border-radius: 99px;
      font-size: 0.7rem;
      font-family: 'JetBrains Mono', monospace;
      margin-bottom: 5px;
    }

    /* ─── Summary Cards ─────────────────────────────────────── */
    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      padding: 20px 40px;
      background: var(--bg2);
      border-top: 1px solid var(--border);
    }
    .card {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 18px;
    }
    .card-header { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
    .card-icon { font-size: 1.1rem; }
    .card-title { font-size: 0.78rem; font-weight: 700; color: var(--text2); letter-spacing: 0.06em; text-transform: uppercase; }
    .card-body { font-size: 0.82rem; color: var(--text); line-height: 1.6; font-family: 'JetBrains Mono', monospace; }

    /* ─── Footer ────────────────────────────────────────────── */
    footer {
      padding: 12px 40px;
      font-size: 0.72rem;
      color: var(--text2);
      border-top: 1px solid var(--border);
      background: var(--bg2);
      font-family: 'JetBrains Mono', monospace;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
    }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.7rem; }
    .legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

    /* ─── Responsive ────────────────────────────────────────── */
    @media (max-width: 720px) {
      .header { padding: 18px 20px; }
      .cards  { grid-template-columns: 1fr; padding: 14px 20px; }
      footer  { padding: 10px 20px; }
      .legend { display: none; }
    }

    /* ─── Print ─────────────────────────────────────────────── */
    @media print {
      body { background: #fff; color: #000; }
      .header-controls, #tooltip { display: none !important; }
      .diagram-wrap {
        overflow: visible;
        background: #fff;
        background-image: none;
        height: auto;
      }
      .diagram-wrap svg { width: 100%; height: auto; }
      .cards { background: #fff; }
      footer { background: #fff; }
      [data-theme="dark"] .comp-label  { fill: #000 !important; }
      [data-theme="dark"] .comp-sublabel { fill: #555 !important; }
    }
  </style>
</head>
<body>

  <!-- ─── Header ─── -->
  <header class="header">
    <div class="header-left">
      <div class="status-dot"></div>
      <div class="title-block">
        <h1>{{TITLE}}</h1>
        <p>{{SUBTITLE}}</p>
      </div>
    </div>
    <div class="header-controls">
      <button class="ctrl-btn" onclick="resetZoom()" title="ズームリセット">⊙ Reset</button>
      <button class="ctrl-btn" onclick="zoomIn()">＋ Zoom</button>
      <button class="ctrl-btn" onclick="zoomOut()">－ Zoom</button>
      <button class="ctrl-btn" id="theme-btn" onclick="toggleTheme()">☾ Light</button>
      <button class="ctrl-btn" onclick="window.print()">⎙ Print</button>
    </div>
  </header>

  <!-- ─── Diagram ─── -->
  <div class="diagram-wrap" id="diagram-wrap">
    <svg id="diagram-svg"
         viewBox="0 0 {{SVG_WIDTH}} {{SVG_HEIGHT}}"
         xmlns="http://www.w3.org/2000/svg"
         preserveAspectRatio="xMidYMid meet">
      <defs>
        <!-- Grid pattern (subtle, additional to CSS bg) -->
        <pattern id="svg-grid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="0.5"/>
        </pattern>

        <!-- Glow filter -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>

        <!-- Arrowhead markers — one per type color -->
        <marker id="arrow-frontend" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#06b6d4"/>
        </marker>
        <marker id="arrow-frontend-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
          <polygon points="0 0, 8 3, 0 6" fill="#06b6d4"/>
        </marker>
        <marker id="arrow-backend" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
        </marker>
        <marker id="arrow-backend-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
          <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
        </marker>
        <marker id="arrow-database" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#8b5cf6"/>
        </marker>
        <marker id="arrow-database-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
          <polygon points="0 0, 8 3, 0 6" fill="#8b5cf6"/>
        </marker>
        <marker id="arrow-cloud" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#f59e0b"/>
        </marker>
        <marker id="arrow-cloud-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
          <polygon points="0 0, 8 3, 0 6" fill="#f59e0b"/>
        </marker>
        <marker id="arrow-security" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#f43f5e"/>
        </marker>
        <marker id="arrow-security-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
          <polygon points="0 0, 8 3, 0 6" fill="#f43f5e"/>
        </marker>
        <marker id="arrow-queue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#f97316"/>
        </marker>
        <marker id="arrow-queue-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
          <polygon points="0 0, 8 3, 0 6" fill="#f97316"/>
        </marker>
        <marker id="arrow-monitor" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#38bdf8"/>
        </marker>
        <marker id="arrow-monitor-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
          <polygon points="0 0, 8 3, 0 6" fill="#38bdf8"/>
        </marker>
        <marker id="arrow-external" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
        </marker>
        <marker id="arrow-external-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
          <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
        </marker>
      </defs>

      <!-- Background -->
      <rect width="100%" height="100%" fill="transparent"/>

      <g id="diagram-group">
        <!-- ── Layer 1: Zones ── -->
        {{SVG_ZONES}}

        <!-- ── Layer 2: Arrows ── -->
        {{SVG_ARROWS}}

        <!-- ── Layer 3: Components ── -->
        {{SVG_COMPONENTS}}
      </g>
    </svg>
  </div>

  <!-- ─── Tooltip ─── -->
  <div id="tooltip"></div>

  <!-- ─── Summary Cards ─── -->
  <section class="cards">
    <div class="card">
      <div class="card-header">
        <span class="card-icon">{{CARD_1_ICON}}</span>
        <span class="card-title">{{CARD_1_TITLE}}</span>
      </div>
      <div class="card-body">{{CARD_1_BODY}}</div>
    </div>
    <div class="card">
      <div class="card-header">
        <span class="card-icon">{{CARD_2_ICON}}</span>
        <span class="card-title">{{CARD_2_TITLE}}</span>
      </div>
      <div class="card-body">{{CARD_2_BODY}}</div>
    </div>
    <div class="card">
      <div class="card-header">
        <span class="card-icon">{{CARD_3_ICON}}</span>
        <span class="card-title">{{CARD_3_TITLE}}</span>
      </div>
      <div class="card-body">{{CARD_3_BODY}}</div>
    </div>
  </section>

  <!-- ─── Footer ─── -->
  <footer>
    <span>{{FOOTER_TEXT}}</span>
    <div class="legend">
      <span class="legend-item"><span class="legend-dot" style="background:#06b6d4"></span>Frontend</span>
      <span class="legend-item"><span class="legend-dot" style="background:#10b981"></span>Backend</span>
      <span class="legend-item"><span class="legend-dot" style="background:#8b5cf6"></span>Database</span>
      <span class="legend-item"><span class="legend-dot" style="background:#f59e0b"></span>Cloud</span>
      <span class="legend-item"><span class="legend-dot" style="background:#f43f5e"></span>Security</span>
      <span class="legend-item"><span class="legend-dot" style="background:#f97316"></span>Queue</span>
      <span class="legend-item"><span class="legend-dot" style="background:#38bdf8"></span>Monitor</span>
      <span class="legend-item"><span class="legend-dot" style="background:#64748b"></span>External</span>
    </div>
  </footer>

  <script>
    /* ─── Theme toggle ─────────────────────────────── */
    const html = document.documentElement;
    const themeBtn = document.getElementById('theme-btn');
    function toggleTheme() {
      const isDark = html.dataset.theme === 'dark';
      html.dataset.theme = isDark ? 'light' : 'dark';
      themeBtn.textContent = isDark ? '☽ Dark' : '☾ Light';
    }

    /* ─── Zoom / Pan ───────────────────────────────── */
    let scale = 1, tx = 0, ty = 0;
    let dragging = false, startX = 0, startY = 0;
    const group = document.getElementById('diagram-group');
    const wrap  = document.getElementById('diagram-wrap');

    function applyTransform() {
      group.setAttribute('transform', `translate(${tx},${ty}) scale(${scale})`);
    }
    function zoomIn()    { scale = Math.min(scale * 1.2, 4);   applyTransform(); }
    function zoomOut()   { scale = Math.max(scale / 1.2, 0.25); applyTransform(); }
    function resetZoom() { scale = 1; tx = 0; ty = 0; applyTransform(); }

    wrap.addEventListener('wheel', e => {
      e.preventDefault();
      const delta = e.deltaY < 0 ? 1.12 : 0.89;
      scale = Math.min(Math.max(scale * delta, 0.2), 4);
      applyTransform();
    }, { passive: false });

    wrap.addEventListener('mousedown', e => {
      if (e.button !== 0) return;
      dragging = true;
      startX = e.clientX - tx;
      startY = e.clientY - ty;
    });
    window.addEventListener('mousemove', e => {
      if (!dragging) return;
      tx = e.clientX - startX;
      ty = e.clientY - startY;
      applyTransform();
    });
    window.addEventListener('mouseup', () => { dragging = false; });

    /* ─── Tooltip ──────────────────────────────────── */
    const TYPE_COLOR = {
      frontend:'#06b6d4', backend:'#10b981', database:'#8b5cf6',
      cloud:'#f59e0b', security:'#f43f5e', queue:'#f97316',
      monitor:'#38bdf8', external:'#64748b'
    };
    const TYPE_LABEL = {
      frontend:'Frontend', backend:'Backend', database:'Database',
      cloud:'Cloud/Infra', security:'Security', queue:'Queue/Event',
      monitor:'Monitor', external:'External'
    };
    const tooltip = document.getElementById('tooltip');

    document.querySelectorAll('.component').forEach(el => {
      el.addEventListener('mouseenter', e => {
        const type = el.dataset.type || 'external';
        const name = el.dataset.name || '';
        const tech = el.dataset.tech || '';
        const desc = el.dataset.desc || '';
        const color = TYPE_COLOR[type] || '#64748b';
        const label = TYPE_LABEL[type] || type;
        tooltip.innerHTML = `
          <span class="tt-badge" style="background:${color}22;color:${color};border:1px solid ${color}44">${label}</span>
          <strong>${name}</strong>
          ${tech ? `<div class="tt-tech">${tech}</div>` : ''}
          ${desc ? `<div class="tt-desc">${desc}</div>` : ''}
        `;
        tooltip.style.display = 'block';
        positionTooltip(e);
      });
      el.addEventListener('mousemove', positionTooltip);
      el.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
    });

    function positionTooltip(e) {
      const margin = 14;
      let x = e.clientX + margin;
      let y = e.clientY + margin;
      const tw = tooltip.offsetWidth;
      const th = tooltip.offsetHeight;
      if (x + tw > window.innerWidth  - 10) x = e.clientX - tw - margin;
      if (y + th > window.innerHeight - 10) y = e.clientY - th - margin;
      tooltip.style.left = x + 'px';
      tooltip.style.top  = y + 'px';
    }
  </script>
</body>
</html>
