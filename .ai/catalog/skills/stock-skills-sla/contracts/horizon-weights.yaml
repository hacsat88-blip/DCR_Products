# Horizon Weights — investment_horizon 別スコアウェイト
# value_growth モードの総合スコア計算に使用する。
# analyst / screener が value_growth スコアリング時に参照する。

horizons:
  short_1_2y:
    label: "1〜2年"
    weights:
      tenx_scenario:   0.25   # 10倍株シナリオ現実度
      undervalue:      0.40   # 割安度
      growth:          0.35   # 成長性
    focus:
      - 業績修正・決算進捗
      - PER/PBR再評価余地
      - 直近カタリスト（決算・IR・政策）
      - 需給・出来高・センチメント
    note: "短期売買ではなく、1〜2年の業績進捗・評価見直しとして扱う"

  mid_3_5y:
    label: "3〜5年"
    weights:
      tenx_scenario:   0.35
      undervalue:      0.30
      growth:          0.35
    focus:
      - 売上・利益 CAGR
      - 中計達成可能性
      - 利益率改善トレンド
      - 事業拡張・競争優位
    note: "デフォルトの分析レンジ"

  long_10y_plus:
    label: "10年以上"
    weights:
      tenx_scenario:   0.45
      undervalue:      0.15
      growth:          0.40
    focus:
      - 市場規模と成長余地
      - 競争優位の持続性
      - 事業耐久性・参入障壁
      - 資本配分の質
      - 複利成長ポテンシャル
    note: "不確実性が最大。到達条件ベースで示し、価格目標は出さない"

  multi:
    label: "複数期間横断"
    weights: null  # 各期間を個別採点し横断比較
    focus:
      - 各期間でスコアと強み/弱みを個別算出
      - 期間別の最適エントリーポイント考察
    note: "short/mid/long を全て出し、期間別の投資適合性を比較する"

defaults:
  investment_horizon: mid_3_5y
  note: "ユーザーが指定しない場合は mid_3_5y を採用"
