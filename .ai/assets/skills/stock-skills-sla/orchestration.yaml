# Stock Skills SLA — オーケストレーション定義
# B (stock_skills_2) の orchestration.yaml を継承し、+α の制御ルールを追加。

# ─── リトライルール ──────────────────────────────────────────────────
retry_rules:
  - condition: "スクリーニング結果が0件"
    action: "条件を緩めて screener を再起動（PER閾値を上げる、時価総額制限を外す等）"
    max_retry: 2

  - condition: "analyst の分析に必要なデータが取れなかった"
    action: "EDINETツール → web_search の順でフォールバック取得"
    max_retry: 1

  - condition: "EDINET ツール失敗"
    action: "1回再試行 → 失敗継続なら web_search フォールバック（[W](Fallback) 表記）"
    max_retry: 1

  - condition: "strategist のレコメンドに矛盾がある"
    action: "health-checker で事実を再確認してから strategist を再起動"
    max_retry: 1

  - condition: "連続3項目以上でツール失敗"
    action: "🟡[Fix] 宣言、重い呼出を控えて縮退分析を完遂"
    max_retry: 0

# ─── Reviewer 起動制御（3分類）───────────────────────────────────────
auto_review:
  trigger:
    - context: pre_trade_confirmation       # 売買確定直前（「はい」「実行して」等）
    - context: conviction_violation         # conviction 銘柄への売却提案
    - context: lesson_citation_zero         # lesson 引用0件で投資提案出力
    - context: convergence_gate_triggered   # 禁止語検出後の再出力
  action: append_reviewer
  skip_condition: reviewer_already_executed

adhoc_review:
  trigger:
    - agent_includes: strategist
    - agent_includes: screener
    - output_contains: [売却, 購入, 入替, リバランス]
  action: append_review_prompt
  prompt: "🔍 Reviewerでチェック？ [y/skip]"
  user_approval_keywords: [y, yes, レビューして, チェックして, review]

skip_review:
  trigger:
    - agent_only: health-checker
    - agent_only: researcher
    - agent_only: analyst
    - agent_only: risk-assessor

# ─── Reviewer FAIL 時 ────────────────────────────────────────────────
retry_on_fail:
  max_retries: 2
  before_retry: ask_user   # FAIL理由をユーザーに提示し修正方針を確認
  on_pass_or_warn: auto    # PASS/WARN はそのまま出力

# ─── Convergence Gate（α2）──────────────────────────────────────────
convergence_gate:
  apply_to: [screener, analyst, strategist, reviewer]
  # 禁止語リストの正本は contracts/safety-protocol.md の「禁止語」セクション。
  # ここでは二重管理を避けるため参照のみ。オーケストレーターが起動時に
  # Read("contracts/safety-protocol.md") して注入済みのリストを使用すること。
  banned_words_source: "contracts/safety-protocol.md#禁止語"
  on_detection:
    label: "🟡[Fix]: Convergence Gate — 禁止語検出"
    action: "禁止語を含む文を「判断材料の整理」に書き換えて再出力"
    max_rewrite: 1

# ─── Preflight（起動前チェック）──────────────────────────────────────
preflight:
  checks:
    - name: edinet_connection
      tool: search_companies
      query: "テスト"
      on_fail: "⚠️EDINET未接続(縮退モード) を冒頭表示、全財務データを [W] で代替"
    - name: portfolio_file
      path: "data/portfolio.csv"
      on_fail: "PF系機能はスキップ。ユーザーに data/portfolio.csv 作成を案内"
    - name: notes_dir
      path: "data/notes/"
      on_fail: "lesson/thesis は空として続行（graceful degradation）"

# ─── α4 Conviction × Scenario 二重ロック ───────────────────────────
conviction_scenario_lock:
  description: |
    Conviction銘柄（thesis に「ホールド確定」含む）への売却提案は原則禁止。
    ただし、以下の「下振れトリガー成立条件」を満たした場合はロックを条件付き解除する。
  unlock_conditions:
    - "analyst の期間別シナリオで「下振れ」の信頼度が「高」かつ根拠強度「A」"
    - "財務警戒 🔴要警戒 が新たに発火（純資産マイナス/CF連続マイナス/自己資本<10%）"
    - "ユーザーが明示的に『テーゼ崩壊かもしれない』と入力した"
  unlock_action: |
    「テーゼ崩壊の可能性」を明示し、ユーザーの確認を得た上で売却提案を提示する。
    conviction_override として notes に記録することを提案する。

# ─── 並列実行 ──────────────────────────────────────────────────────
parallel_execution:
  screener_split: true    # テーマ×地域ごとに独立 screener を同時発行可

# ─── α3 Lesson ↔ 下振れトリガー リンク ─────────────────────────────
lesson_trigger_link:
  description: |
    analyst/screener がシナリオ出力時、data/notes/ の lesson.trigger を
    「下振れシナリオの主要トリガー候補プール」に自動追加する。
    過去に経験した罠を構造的に拾うことで同じ失敗を防ぐ。
  format: |
    ⚠️[lesson-link] 過去事例: <trigger要約>（<日付>）
    expected_action: <期待行動>
  apply_to: [analyst, screener, strategist]

# ─── 月次ルーティン（α10）────────────────────────────────────────
routines:
  monthly:
    label: "月次シナリオ・レンズ・サーベイ"
    trigger: "月次チェック / 月次レポート / routine-monthly"
    agents: [health-checker, analyst, reviewer]
    description: |
      保有銘柄を value_growth レンズで月次再採点する。
      ★変動・推定軸増加・下振れトリガー成立を差分レポート化し、
      「要テーゼ更新」「要追加確認」を発火させる。
    pattern: C
    header: "🎯 [routine-monthly] 月次シナリオ・レンズ・サーベイ"
