# Value Growth Scoring — 割安成長株専用スコア
# mode=value_growth 時に共通5軸に加えて使用する。
# screener / analyst が参照する。

# ─── 1. 10倍株シナリオ現実度（0–10点）─────────────────────────
tenx_scenario:
  label: "10倍株シナリオ現実度"
  scale: 0-10
  evaluate:
    - 市場規模と成長余地（TAM）
    - 現在の時価総額からの拡大余地
    - 売上・利益の複利成長可能性
    - 評価倍率の再評価余地（現PER→想定PER）
    - 既存事業または新規事業の拡張可能性
  note: |
    「10倍確定」という断定はしない。
    「到達条件」として条件付き仮説で示す。
    単一路線（売上のみ or 倍率のみ）依存の場合 ⚠️単一路線依存 を付ける。

# ─── 2. 割安度（0–10点）──────────────────────────────────────
undervalue:
  label: "割安度"
  scale: 0-10
  per_guidance:
    high_score: "PER 15倍以下"
    medium_score: "PER 15〜25倍（成長性考慮）"
    lower_score: "PER 25倍超（成長率次第）"
    note: "PER15倍超でも成長性・収益品質・再評価余地が大きければ除外しない"
  evaluate:
    - PER（会社予想ベース）
    - PBR
    - PSR（売上ベース倍率）
    - EV/EBITDA
    - 配当利回り
    - 利益成長率との比較（PEG ratio の考え方）

# ─── 3. 成長性（0–10点）─────────────────────────────────────
growth:
  label: "成長性"
  scale: 0-10
  evaluate:
    - 売上高成長率（直近3期トレンド）
    - 営業利益成長率
    - 利益率の改善余地
    - ストック収益比率（SaaS・サブスク・リカーリング等）
    - リピート収益の有無
    - 市場拡大性
    - 事業モデルの継続性・スケーラビリティ

# ─── 4. 事業品質ゲート（点数化しない）──────────────────────────
quality_gate:
  label: "事業品質ゲート"
  output: "通過 / 要確認 / 警戒"  # 点数ではなくゲート判定
  criteria:
    - "事業内容が理解しやすいか（ビジネスモデルが明快）"
    - "収益の継続性があるか（一過性でない）"
    - "参入障壁があるか（技術・規制・ネットワーク・ブランド等）"
    - "ニッチトップまたは業界内優位性があるか"
    - "一過性テーマ依存ではないか（SNS主導急騰・政策補助金依存等）"
    - "財務耐久性があるか（純資産・CF・D/E比率）"
    - "希薄化リスクが過大でないか（新株・CB・ワラント等）"
  gate_rules:
    通過: "全項目クリア"
    要確認: "1〜2項目が曖昧・確認不足"
    警戒: "3項目以上でリスクあり、または財務警戒"

# ─── 候補選定条件（screener が参照）────────────────────────────
screening_criteria:
  market: japan  # デフォルト
  size: "小型〜中型株を中心に（時価総額だけで機械的除外しない）"
  results_count:
    total: 5-10
    detail_top: 3
  priority:
    high:
      - "直近業績で売上・営業利益・経常利益・純利益の成長が確認できる"
      - "今期会社予想または中計で成長継続が見込める"
      - "PER 15倍以下（高評価目安）"
      - "ストック型・継続課金・リピート収益・参入障壁・ニッチトップ"
      - "事業内容が理解しやすく、選択レンジ内の成長イメージを描ける"
      - "本業の成長力が主役（株主還元のみでない）"
    low:
      - "一時的テーマ株・材料株・SNS主導急騰株"
      - "すでに高成長が過度に織り込まれている銘柄（⚠️過熱感）"

# ─── 総合スコア計算方式 ─────────────────────────────────────
total_score:
  method: |
    horizon_weights.yaml の investment_horizon に従い、
    tenx_scenario / undervalue / growth のウェイトを適用して総合点を算出。
    事業品質ゲートが「警戒」の場合は総合点から1〜2点減点し
    「🔴要警戒」ラベルを付与する。

# ─── ランキング出力形式 ──────────────────────────────────────
ranking_output:
  columns:
    - 順位
    - コード
    - 銘柄名
    - 事業概要（1行）
    - 時価総額
    - 株価
    - PER
    - PBR
    - PSR
    - 10倍株シナリオ現実度（/10）
    - 割安度（/10）
    - 成長性（/10）
    - 総合（ウェイト加重）
    - 判定ラベル（🟢🟡🔴）
    - 主リスク
