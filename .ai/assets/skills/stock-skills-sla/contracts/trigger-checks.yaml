# Trigger Checks — 追加チェック発火条件
# 該当時のみ発火する。health-checker / analyst / screener が参照する。
# 各チェックは独立して評価し、複数発火することもある。

checks:
  event_period:
    label: "イベント期リスク"
    tag: "⚠️イベント期リスク"
    trigger:
      - 決算発表が2週間以内
      - 権利落ち日が2週間以内
      - 日銀政策会合・FOMC が1週間以内
      - 重要IR（中計・業績修正等）の予告あり
    action: "短期シナリオの不確実性を高めに設定し、タグを付与"

  low_price_stock:
    label: "低位株"
    tag: "⚠️低位株"
    trigger:
      - "JP: 株価 300円未満"
      - "US: 株価 5ドル未満"
    action: |
      以下を必ず確認する:
      - 流動性（出来高・売買代金）
      - 希薄化リスク（CB・ワラント・新株予約権）
      - 継続企業注記（GC注記）の有無 [E]
      - 上場維持基準の適合状況

  financial_alert:
    label: "財務警戒"
    tag: "🔴要警戒"
    trigger:
      - "純資産 < 0（債務超過）"
      - "自己資本比率 < 10%"
      - "営業CF が2期以上連続マイナス"
    action: |
      🔴要警戒 タグを付与し、詳細理由を明記する。
      strategist が売却提案する場合の優先根拠とする。

  concentration_risk:
    label: "相関・集中リスク"
    trigger: "保有銘柄 2銘柄以上"
    action: |
      以下を確認する（health-checker / strategist）:
      - 同一セクター集中（同一セクターが PF の 40% 超）
      - 同一テーマ集中（AI・防衛・インバウンド等）
      - 低位株集中（300円未満が PF の 30% 超）
      - 通貨集中（USD 60% 超等）

  overheating:
    label: "過熱感"
    tag: "⚠️過熱感"
    trigger:
      - "材料・ニュース・SNSだけで短期急騰（直近1ヶ月 +50% 超）"
      - "出来高が直近平均の 5倍以上"
      - "RSI 80 超"
    action: "過熱リスクを明記し、シナリオの下振れ幅を広めに取る"

  single_path_dependency:
    label: "単一路線依存"
    tag: "⚠️単一路線依存"
    trigger: |
      10倍到達条件が以下のいずれか一つに過度依存:
      - 売上成長のみ（利益率と倍率は現状維持前提）
      - 評価倍率の急拡大のみ（業績変化なし）
      - 特定の政策・補助金のみ
    action: "条件の細さを明記し、long_10y_plus では「要追加確認」枠に置く"

  preflight_edinet:
    label: "EDINET接続診断"
    trigger: "起動時・分析開始前"
    action: |
      EDINETツール（search_companies等）の応答を確認する。
      - 接続OK → 通常モード
      - 接続NG → 冒頭に `⚠️EDINET未接続(縮退モード)` を表示し、
                  全財務データを [W](Fallback) で代替取得する
