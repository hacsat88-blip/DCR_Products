function ScoreRing({ score, size = 48, strokeWidth = 3 }) {
  const radius = (size - strokeWidth) / 2;
  const circumference = 2 * Math.PI * radius;
  const s = Math.min(100, Math.max(0, score));
  const offset = circumference - (s / 100) * circumference;
  const color = score >= 75 ? '#22C55E' : score >= 55 ? '#4C6EF5' : score >= 40 ? '#F59E0B' : '#EF4444';
  return (
    <div className="relative inline-flex items-center justify-center animate-scaleIn">
      <svg width={size} height={size}>
        <circle cx={size/2} cy={size/2} r={radius} fill="none" stroke="rgba(148,163,184,0.1)" strokeWidth={strokeWidth}/>
        <circle cx={size/2} cy={size/2} r={radius} fill="none" stroke={color} strokeWidth={strokeWidth}
          strokeDasharray={circumference} strokeDashoffset={offset} strokeLinecap="round"
          transform={`rotate(-90 ${size/2} ${size/2})`}
          style={{transition:'stroke-dashoffset 1s cubic-bezier(0.16,1,0.3,1)'}}/>
      </svg>
      <span className="absolute font-mono text-xs font-bold" style={{color, fontSize: size < 40 ? '9px' : '11px'}} aria-hidden="true">{score}</span>
    </div>
  );
}

function Sparkline({ data, width = 80, height = 28, color = "#4C6EF5" }) {
  if (!data || data.length < 2) return null;
  const vals = data.map(d => typeof d === 'number' ? d : d.price);
  const min = Math.min(...vals); const max = Math.max(...vals);
  const range = max - min || 1;
  const points = vals.map((v, i) => {
    const x = (i / (vals.length - 1)) * width;
    const y = height - ((v - min) / range) * (height - 4) - 2;
    return `${x},${y}`;
  }).join(' ');
  const gradId = `sp_${Math.random().toString(36).slice(2,8)}`;
  return (
    <svg width={width} height={height} className="flex-shrink-0">
      <defs>
        <linearGradient id={gradId} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.3"/>
          <stop offset="100%" stopColor={color} stopOpacity="0"/>
        </linearGradient>
      </defs>
      <polygon points={`0,${height} ${points} ${width},${height}`} fill={`url(#${gradId})`}/>
      <polyline points={points} fill="none" stroke={color} strokeWidth="1.5" strokeLinejoin="round"/>
    </svg>
  );
}

function RadarSVG({ data, size = 140 }) {
  const cx = size / 2, cy = size / 2, r = size / 2 - 20;
  const labels = ['MACRO', 'CF', 'VALUE', 'MOMENTUM', 'RISK'];
  const n = labels.length;
  const angleStep = (2 * Math.PI) / n;
  const getPoint = (idx, val) => {
    const angle = -Math.PI / 2 + idx * angleStep;
    const dist = (val / 5) * r;
    return { x: cx + dist * Math.cos(angle), y: cy + dist * Math.sin(angle) };
  };
  const gridLevels = [1, 2, 3, 4, 5];
  const dataPoints = (data || [0,0,0,0,0]).map((v, i) => getPoint(i, v));
  const polyPoints = dataPoints.map(p => `${p.x},${p.y}`).join(' ');

  return (
    <svg width={size} height={size} className="mx-auto">
      {gridLevels.map(lv => {
        const pts = labels.map((_, i) => getPoint(i, lv));
        return <polygon key={lv} points={pts.map(p=>`${p.x},${p.y}`).join(' ')}
          fill="none" stroke="rgba(148,163,184,0.1)" strokeWidth="1"/>;
      })}
      {labels.map((_, i) => {
        const p = getPoint(i, 5);
        return <line key={i} x1={cx} y1={cy} x2={p.x} y2={p.y} stroke="rgba(148,163,184,0.08)" strokeWidth="1"/>;
      })}
      <polygon points={polyPoints} fill="rgba(76,110,245,0.2)" stroke="#4C6EF5" strokeWidth="2"/>
      {dataPoints.map((p, i) => <circle key={i} cx={p.x} cy={p.y} r="3" fill="#4C6EF5"/>)}
      {labels.map((l, i) => {
        const p = getPoint(i, 5.8);
        return <text key={i} x={p.x} y={p.y} textAnchor="middle" dominantBaseline="middle"
          fill="#94A3B8" fontSize="9" fontFamily="Inter, sans-serif">{l}</text>;
      })}
    </svg>
  );
}

const initialState = {
  activeTab: 'market',
  stocks: MOCK_STOCKS,
  holdings: loadLS('holdings', {}),
  memos: loadLS('memos', {}),
  selectedStockId: null,
  detailOpen: false,
  sortKey: 'score_desc',
  navigator: { status: 'idle', results: null, settings: { market: 'JP', risk: 'mid', horizon: 'mid' } },
  scoringWeights: loadLS('scoringWeights', { revenueGrowth: 1.0, opGrowth: 1.0, cfGrowth: 1.0, per: 1.0, momentum: 1.0 }),
  alerts: loadLS('alerts', []),
  alertRules: loadLS('alertRules', []),
  compareSelection: [],
};

function reducer(state, action) {
  switch (action.type) {
    case 'SET_TAB': return { ...state, activeTab: action.payload };
    case 'SET_HOLDINGS': {
      const h = { ...state.holdings, ...action.payload };
      return { ...state, holdings: h };
    }
    case 'SET_MEMO': {
      const m = { ...state.memos, [action.payload.id]: action.payload.text };
      return { ...state, memos: m };
    }
    case 'SELECT_STOCK': return { ...state, selectedStockId: action.payload, detailOpen: true };
    case 'CLOSE_DETAIL': return { ...state, detailOpen: false };
    case 'SET_SORT': return { ...state, sortKey: action.payload };
    case 'SET_NAV_STATUS': return { ...state, navigator: { ...state.navigator, status: action.payload } };
    case 'SET_NAV_RESULTS': return { ...state, navigator: { ...state.navigator, results: action.payload, status: 'done' } };
    case 'SET_NAV_SETTINGS': return { ...state, navigator: { ...state.navigator, settings: { ...state.navigator.settings, ...action.payload } } };
    case 'SET_WEIGHTS': {
      const w = { ...state.scoringWeights, ...action.payload };
      return { ...state, scoringWeights: w };
    }
    case 'ADD_ALERT': {
      const a = [...state.alerts, action.payload];
      return { ...state, alerts: a };
    }
    case 'ADD_ALERT_RULE': {
      const r = [...state.alertRules, action.payload];
      return { ...state, alertRules: r };
    }
    case 'DELETE_ALERT_RULE': {
      const r = state.alertRules.filter((_, i) => i !== action.payload);
      return { ...state, alertRules: r };
    }
    case 'TOGGLE_COMPARE': {
      const id = action.payload;
      const cs = state.compareSelection.includes(id)
        ? state.compareSelection.filter(x => x !== id)
        : state.compareSelection.length < 4 ? [...state.compareSelection, id] : state.compareSelection;
      return { ...state, compareSelection: cs };
    }
    case 'IMPORT_DATA': {
      const d = action.payload;
      return {
        ...state,
        holdings: d.holdings || state.holdings,
        memos: d.memos || state.memos,
        scoringWeights: d.scoringWeights || state.scoringWeights,
        alertRules: d.alertRules || state.alertRules,
      };
    }
    default: return state;
  }
}

    { label: '日経225', value: fmt.num(nk[nk.length-1].close), sub: '終値', color: '#F59E0B', data: nk.map(d => d.close), trend: nk[nk.length-1].close >= nk[nk.length-2].close ? '▲' : '▼' },
  ];

  return (
    <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-2 sm:gap-3 mb-4">
      {cards.map((c, i) => (
        <GlassCard key={i} className="animate-fadeUp kpi-card-hover" style={{animationDelay:`${i*60}ms`}}>
          <div className="text-[11px] text-text-muted mb-1">{c.label}</div>
          <div className="flex items-end justify-between">
            <div>
              <div className="flex items-center gap-1.5">
                <span className="text-lg font-bold font-mono animate-value" style={{color: c.color || '#F1F5F9'}} key={c.value}>{c.value}</span>
                {c.trend && <span className={`text-xs font-bold ${c.trend === '▲' ? 'text-positive' : 'text-danger'}`}>{c.trend}</span>}
              </div>
              <div className="text-[10px] text-text-muted">{c.sub}</div>
            </div>
            {c.data && !c.isDoughnut && !c.isBar && <Sparkline data={c.data} color={c.color} width={60} height={24}/>}
            {c.isDoughnut && (
              <svg width={36} height={36} viewBox="0 0 36 36">
                {(() => {
                  const total = c.dData.reduce((a,b)=>a+b,0) || 1;
                  const colors = ['#22C55E','#06B6D4','#EF4444'];
                  let cum = 0;
                  return c.dData.map((v,j)=>{
                    const pct = v/total; const start = cum; cum += pct;
                    const r = 14, cx = 18, cy = 18;
                    const startAngle = start * 2 * Math.PI - Math.PI/2;
                    const endAngle = (start+pct) * 2 * Math.PI - Math.PI/2;
                    const large = pct > 0.5 ? 1 : 0;
                    const x1 = cx + r * Math.cos(startAngle), y1 = cy + r * Math.sin(startAngle);
                    const x2 = cx + r * Math.cos(endAngle), y2 = cy + r * Math.sin(endAngle);
                    return pct > 0 ? <path key={j} d={`M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2} Z`} fill={colors[j]} opacity="0.8"/> : null;

              <div className="flex items-end gap-0.5 h-6">

                  <div key={j} className="w-1.5 rounded-sm" style={{height:`${Math.abs(v)*1.5+2}px`, background: v>=0?'var(--positive)':'var(--danger)', opacity: j===4?1:0.4}}/>
                ))}
              </div>
            )}
          </div>
        </GlassCard>
      ))}
    </div>
  );
}

function StockDetailModal({ stock, memo, holdings, onMemoChange, onHoldingsChange, onClose }) {
  if (!stock) return null;
  const a = ACTION_LABELS[stock.action];
  const shares = holdings || 0;
  const modalRef = React.useRef(null);

  React.useEffect(() => {
    const modal = modalRef.current;
    if (!modal) return;
    const focusable = modal.querySelectorAll('button, input, textarea, select, [tabindex]:not([tabindex="-1"])');
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    if (first) first.focus();
    const trapFocus = (e) => {
      if (e.key === 'Escape') { onClose(); return; }
      if (e.key !== 'Tab') return;
      if (e.shiftKey) { if (document.activeElement === first) { e.preventDefault(); last.focus(); } }
      else { if (document.activeElement === last) { e.preventDefault(); first.focus(); } }
    };
    modal.addEventListener('keydown', trapFocus);
    return () => modal.removeEventListener('keydown', trapFocus);
  }, [stock]);

  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center sm:p-4" onClick={onClose}>
      <div className="absolute inset-0 bg-black/60 backdrop-blur-sm"/>
      <div ref={modalRef} role="dialog" aria-modal="true" aria-labelledby="stock-detail-title" className="relative w-full sm:max-w-2xl h-[95vh] sm:h-auto sm:max-h-[85vh] overflow-y-auto glass-panel-elevated p-4 sm:p-6 rounded-t-2xl sm:rounded-xl animate-slideInRight" onClick={e=>e.stopPropagation()}>
        <button onClick={onClose} aria-label="閉じる" className="absolute top-4 right-4 w-8 h-8 rounded-lg bg-panel-hover hover:bg-danger/20 text-text-muted hover:text-danger flex items-center justify-center text-lg transition-colors">✕</button>
        <div className="flex items-center gap-3 mb-4">

/* ==============================
   TAB 2: PORTFOLIO
   ============================== */
function PortfolioTab({ state, dispatch }) {
  const { stocks, holdings } = state;
  const { holdingStocks, totalValue, totalPL, weightedScore, pieData } = React.useMemo(() => {
    const holdingStocks = stocks.filter(s => (holdings[s.id] || 0) > 0);
    const totalValue = holdingStocks.reduce((a,s) => a + s.price * (holdings[s.id]||0), 0);
    const totalPL = holdingStocks.reduce((a,s) => a + s.price * (holdings[s.id]||0) * (s.changePercent/100), 0);
    const weightedScore = holdingStocks.length ? holdingStocks.reduce((a,s) => {
      const w = s.price * (holdings[s.id]||0) / (totalValue||1);
      return a + s.score * w;
    }, 0).toFixed(1) : 0;
    const sectorData = {};
    holdingStocks.forEach(s => {
      const val = s.price * (holdings[s.id]||0);
      sectorData[s.sector] = (sectorData[s.sector]||0) + val;
    });
    const pieData = Object.entries(sectorData).map(([name, value]) => ({name, value}));
    return { holdingStocks, totalValue, totalPL, weightedScore, pieData };
  }, [stocks, holdings]);
  const PIE_COLORS = ['#4C6EF5','#22C55E','#06B6D4','#F59E0B','#EF4444','#A855F7'];

  const adjustHolding = React.useCallback((id, delta, e) => {
    const mult = e?.ctrlKey ? 1000 : e?.shiftKey ? 1 : 100;
    const current = holdings[id] || 0;
    const next = Math.max(0, current + delta * mult);
    dispatch({type:'SET_HOLDINGS', payload:{[id]: next}});
  }, [holdings, dispatch]);

  return (
    <div className="animate-fadeUp">
      <SectionTitle icon="💼">ポートフォリオ概要</SectionTitle>
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 sm:gap-3 mb-4">
        {[
          ['総評価額', fmt.price(totalValue), 'primary'],
          ['保有銘柄数', `${holdingStocks.length}銘柄`, 'secondary'],
          ['加重スコア', weightedScore, 'positive'],
          ['日次損益', `${totalPL >= 0 ? '+' : ''}${fmt.price(Math.round(totalPL))}`, totalPL >= 0 ? 'positive' : 'danger'],
        ].map(([label, value, color], i) => (
          <GlassCard key={i} className="animate-fadeUp" style={{animationDelay:`${i*80}ms`}}>
            <div className="text-[11px] text-text-muted mb-1">{label}</div>
            <div className={`text-lg font-mono font-bold text-${color} animate-value`} key={value}>{value}</div>
          </GlassCard>
        ))}
      </div>

      <CollapsibleSection title="保有銘柄" icon="📊">
        <div className="overflow-x-auto">
          <table className="w-full text-xs">
            <thead>
              <tr className="text-text-muted border-b border-border-subtle">
                <th className="py-2 px-2 text-left">銘柄</th>
                <th className="py-2 px-2 text-center">株数</th>
                <th className="py-2 px-2 text-right">評価額</th>
                <th className="py-2 px-2 text-right">比率</th>
                <th className="py-2 px-2 text-right">日次P&L</th>
                <th className="py-2 px-2 text-center">操作</th>
              </tr>
            </thead>
            <tbody>
              {holdingStocks.map(s => {
                const shares = holdings[s.id] || 0;
                const val = s.price * shares;
                const pl = val * (s.changePercent / 100);
                const weight = totalValue ? ((val / totalValue) * 100).toFixed(1) : 0;
                return (
                  <tr key={s.id} className="border-b border-border-subtle/50 hover:bg-panel-hover">
                    <td className="py-2 px-2"><span className="font-semibold">{s.name}</span><span className="text-text-muted ml-1">{s.code}</span></td>
                    <td className="py-2 px-2 text-center font-mono">{shares.toLocaleString()}</td>
                    <td className="py-2 px-2 text-right font-mono">{fmt.price(val)}</td>
                    <td className="py-2 px-2 text-right font-mono">{weight}%</td>
                    <td className={`py-2 px-2 text-right font-mono ${pl >= 0 ? 'text-positive' : 'text-danger'}`}>{pl >= 0 ? '+' : ''}{fmt.price(Math.round(pl))}</td>
                    <td className="py-2 px-2 text-center">
                      <div className="flex items-center justify-center gap-1">
                        <button onClick={(e) => adjustHolding(s.id, -1, e)} aria-label={`${s.name}の株数を減らす`} className="px-2 py-0.5 rounded bg-danger/20 text-danger hover:bg-danger/30 text-[10px]">−</button>
                        <span className="font-mono text-[10px] w-12 text-center">{shares}</span>
                        <button onClick={(e) => adjustHolding(s.id, 1, e)} aria-label={`${s.name}の株数を増やす`} className="px-2 py-0.5 rounded bg-positive/20 text-positive hover:bg-positive/30 text-[10px]">+</button>
                      </div>
                    </td>
                  </tr>
                );
              })}
              {holdingStocks.length === 0 && (
                <tr><td colSpan={6} className="py-8 text-center text-text-muted" style={{animation: 'fadeUp 0.4s ease-out'}}>保有銘柄がありません。下のフォームから追加してください。</td></tr>
              )}
            </tbody>
          </table>
        </div>
      </CollapsibleSection>

      <CollapsibleSection title="銘柄追加・編集" icon="✏️">
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          {stocks.map(s => {
            const shares = holdings[s.id] || 0;
            return (
              <div key={s.id} className="flex items-center justify-between p-3 bg-panel-elevated rounded-lg">
                <div className="flex items-center gap-2">
                  <ScoreRing score={s.score} size={28} strokeWidth={2}/>
                  <div>
                    <div className="text-xs font-semibold">{s.name}</div>
                    <div className="text-[10px] text-text-muted">{s.code} | {fmt.price(s.price)}</div>
                  </div>
                </div>
                <div className="flex items-center gap-1">
                  <button onClick={(e) => adjustHolding(s.id, -1, e)} aria-label={`${s.name}の株数を減らす`} className="w-7 h-7 rounded-lg bg-panel hover:bg-danger/20 text-text-muted hover:text-danger flex items-center justify-center text-sm">−</button>
                  <span className="w-14 text-center font-mono text-xs">{shares}</span>
                  <button onClick={(e) => adjustHolding(s.id, 1, e)} aria-label={`${s.name}の株数を増やす`} className="w-7 h-7 rounded-lg bg-panel hover:bg-positive/20 text-text-muted hover:text-positive flex items-center justify-center text-sm">+</button>
                </div>
              </div>
            );
          })}
        </div>
        <p className="text-[10px] text-text-muted mt-2">💡 Shift+クリック: ±1株 / Ctrl+クリック: ±1000株 / 通常: ±100株</p>
      </CollapsibleSection>

      {pieData.length > 0 && (
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
          <CollapsibleSection title="セクター構成" icon="🥧">
            <div style={{height:220}} aria-label="ポートフォリオ構成比円グラフ" role="img">
              <ResponsiveContainer width="100%" height="100%">
                <PieChart>
                  <Pie data={pieData} cx="50%" cy="50%" innerRadius={50} outerRadius={80} paddingAngle={3} dataKey="value">
                    {pieData.map((_, i) => <Cell key={i} fill={PIE_COLORS[i % PIE_COLORS.length]}/>)}
                  </Pie>
                  <Tooltip formatter={(v) => fmt.price(v)} contentStyle={{background:'#141821',border:'1px solid rgba(148,163,184,0.15)',borderRadius:8,fontSize:11}}/>
                  <Legend formatter={(v) => <span style={{color:'#94A3B8',fontSize:11}}>{v}</span>}/>
                </PieChart>
              </ResponsiveContainer>
            </div>
          </CollapsibleSection>

          <CollapsibleSection title="銘柄別評価額" icon="📊">
            <div style={{height:220}} aria-label="銘柄別評価額棒グラフ" role="img">
              <ResponsiveContainer width="100%" height="100%">
                <BarChart data={holdingStocks.map(s => ({name: s.name, value: s.price * (holdings[s.id]||0)}))}>
                  <CartesianGrid strokeDasharray="3 3" stroke="rgba(148,163,184,0.06)"/>
                  <XAxis dataKey="name" tick={{fontSize:10,fill:'#8896AB'}} axisLine={false}/>
                  <YAxis tick={{fontSize:10,fill:'#8896AB'}} axisLine={false} tickFormatter={v=>fmt.oku(v)}/>
                  <Tooltip formatter={(v) => fmt.price(v)} contentStyle={{background:'#141821',border:'1px solid rgba(148,163,184,0.15)',borderRadius:8,fontSize:11}}/>
                  <Bar dataKey="value" fill="#4C6EF5" radius={[4,4,0,0]} name="評価額"/>
                </BarChart>
              </ResponsiveContainer>
            </div>
          </CollapsibleSection>
        </div>
      )}
    </div>
  );
}

/* ==============================
   TAB 3: AI NAVIGATOR
   ============================== */
function NavigatorTab({ state, dispatch }) {
  const { navigator: nav } = state;
  const [stage, setStage] = React.useState(0);
  const [showSetup, setShowSetup] = React.useState(nav.status === 'idle');

  const stages = ['マクロ分析', '銘柄選定', '討論', '最終判定'];
  const stageIcons = ['🌍', '🔍', '⚖️', '🏆'];
  const stageMessages = ['マクロ経済環境を分析中...', '有望銘柄を選定中...', '多角的に議論中...', '最終評価を生成中...'];
  const stagePercent = [0, 25, 50, 75];

  const runPipeline = () => {
    setShowSetup(false);
    dispatch({type:'SET_NAV_STATUS', payload:'running'});
    setStage(0);
    let s = 0;
    const timer = setInterval(() => {
      s++;
      setStage(s);
      if (s >= 4) {
        clearInterval(timer);
        dispatch({type:'SET_NAV_RESULTS', payload: MOCK_NAVIGATOR});
      }
    }, 800);
  };

  const data = nav.results;
  const settings = nav.settings;

  const settingsOptions = {
    market: [['JP','日本市場'],['US','米国市場'],['GLOBAL','グローバル']],
    risk: [['low','低リスク'],['mid','中リスク'],['high','高リスク']],
    horizon: [['short','短期(~3ヶ月)'],['mid','中期(3-12ヶ月)'],['long','長期(1年+)']],
  };

  if (showSetup) {
    return (
      <div className="max-w-lg mx-auto animate-fadeUp">
        <GlassCard className="p-6">
          <div className="text-center mb-6">
            <div className="text-3xl mb-2">🤖</div>
            <h2 className="text-lg font-bold mb-1">AIナビゲーター</h2>
            <p className="text-xs text-text-secondary">投資条件を設定して分析を開始</p>
          </div>
          {Object.entries(settingsOptions).map(([key, opts]) => (
            <div key={key} className="mb-4">
              <label className="text-xs text-text-muted block mb-1">
                {key === 'market' ? '対象市場' : key === 'risk' ? 'リスク許容度' : '投資期間'}
              </label>
              <div className="flex gap-2">
                {opts.map(([val, label]) => (
                  <button key={val} onClick={() => dispatch({type:'SET_NAV_SETTINGS', payload:{[key]: val}})}
                    className={`flex-1 px-3 py-2 rounded-lg text-xs transition-colors ${settings[key] === val ? 'bg-primary/20 text-primary border border-primary/30' : 'bg-panel-elevated text-text-muted hover:bg-panel-hover border border-transparent'}`}>
                    {label}
                  </button>
                ))}
              </div>
            </div>
          ))}
          <button onClick={runPipeline}
            className="w-full mt-4 py-3 rounded-lg bg-primary text-white font-semibold text-sm hover:bg-primary/90 transition-colors">
            🚀 分析開始
          </button>
        </GlassCard>
      </div>
    );
  }

  if (nav.status === 'running') {
    const pct = stage >= 4 ? 100 : stagePercent[stage] || 0;
    const msg = stage >= 4 ? '完了！' : stageMessages[stage] || '';
    return (
      <div className="max-w-lg mx-auto animate-fadeUp" aria-live="polite">
        <GlassCard className="p-6">
          <h3 className="text-center font-bold mb-2">分析実行中...</h3>
          <div className="text-center text-xs text-text-secondary mb-1">{msg}</div>
          <div className="text-center text-lg font-mono font-bold text-primary mb-4">{pct}%</div>
          <div className="flex items-center justify-between mb-4">
            {stages.map((s, i) => (
              <React.Fragment key={i}>
                <div className="flex flex-col items-center flex-1">
                  <div className={`w-10 h-10 rounded-full flex items-center justify-center text-lg mb-1 transition-all duration-500
                    ${i < stage ? 'bg-positive/20 text-positive' : i === stage ? 'bg-primary/20 text-primary' : 'bg-panel-elevated text-text-muted'}`}
                    style={i === stage ? {animation:'progressPulse 1.5s infinite'} : {}}
                    >
                    <span className={i === stage ? 'stage-glow' : ''}>{i < stage ? '✓' : stageIcons[i]}</span>
                  </div>
                  <span className={`text-[10px] font-medium ${i < stage ? 'text-positive' : i === stage ? 'text-primary' : 'text-text-muted'}`}>{s}</span>
                </div>
                {i < stages.length - 1 && (
                  <div className={`h-0.5 flex-1 mx-1 mt-[-18px] rounded transition-all duration-700 ${i < stage ? 'bg-positive/40' : 'bg-panel-elevated'}`}/>
                )}
              </React.Fragment>
            ))}
          </div>
          <div className="w-full h-2 bg-panel-elevated rounded-full overflow-hidden">
            <div className="h-full bg-gradient-to-r from-primary to-secondary rounded-full transition-all duration-700"
              style={{width: `${(stage / 4) * 100}%`}}/>
          </div>
        </GlassCard>
      </div>
    );
  }

  if (!data) return null;

  return (
    <div className="animate-fadeUp space-y-4">
      <div className="flex items-center justify-between">
        <h2 className="text-lg font-bold">🤖 AI分析結果</h2>
        <button onClick={() => { setShowSetup(true); dispatch({type:'SET_NAV_STATUS', payload:'idle'}); }}
          className="text-xs px-3 py-1.5 rounded-lg bg-panel-elevated hover:bg-panel-hover text-text-secondary">
          🔄 再設定
        </button>
      </div>

      {/* Macro Section */}
      <CollapsibleSection title="マクロ環境" icon="🌍">
        <div className="flex items-center gap-3 mb-3">
          <span className="text-2xl">{data.macro.label}</span>
          <div className="flex-1 p-3 bg-panel-elevated rounded-lg">
            <div className="text-xs text-text-muted mb-1">因果連鎖</div>
            <div className="text-xs text-text-secondary">{data.macro.chain}</div>
          </div>
        </div>
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-3">
          <div>
            <div className="text-xs text-text-muted mb-2">注目セクター</div>
            {data.macro.sectors.map((s,i) => (
              <div key={i} className="flex items-center gap-2 p-2 bg-panel rounded-lg mb-1.5">
                <span className="text-sm">📌</span>
                <div>
                  <span className="text-xs font-semibold">{s.name}</span>
                  <span className="text-[10px] text-text-muted ml-2">{s.reason}</span>
                </div>
              </div>
            ))}
          </div>
          <div>
            <div className="text-xs text-text-muted mb-2">リスクファクター</div>
            {data.macro.risks.map((r,i) => (
              <div key={i} className="flex items-center justify-between p-2 bg-panel rounded-lg mb-1.5">
                <span className="text-xs">{r.name}</span>
                <div className="flex items-center gap-2">
                  <span className="text-amber text-[10px]">{'★'.repeat(r.stars)}{'☆'.repeat(5-r.stars)}</span>
                  <span className="text-xs text-text-muted">{r.trend}</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      </CollapsibleSection>

      {/* Stocks Table */}
      <CollapsibleSection title="選定銘柄" icon="🔍">
        <div className="overflow-x-auto">
          <table className="w-full text-xs">
            <thead>
              <tr className="text-text-muted border-b border-border-subtle">
                <th className="py-2 px-2 text-left">コード</th>
                <th className="py-2 px-2 text-left">銘柄名</th>
                <th className="py-2 px-2 text-left">セクター</th>
                <th className="py-2 px-2 text-right">価格</th>

/* ==============================
   TIMELINE CHART COMPONENT
   ============================== */
function TimelineChart({ stocks }) {
  const [tlStockId, setTlStockId] = React.useState(stocks[0]?.id || '');
  const tlStock = stocks.find(s => s.id === tlStockId);
  const tlData = React.useMemo(() => tlStock ? tlStock.chartData.map((d, i) => {
    const baseScore = tlStock.score;
    const jitter = Math.sin(i * 1.7) * 6 + Math.cos(i * 0.9) * 4;
    const trend = (i / (tlStock.chartData.length - 1)) * (baseScore > 70 ? 8 : -4);
    const score = Math.round(Math.min(100, Math.max(0, baseScore - 10 + trend + jitter)));
    return { date: d.date, price: d.price, score };
  }) : [], [tlStock]);
  return (
    <div>
      <div className="flex items-center gap-3 mb-3">
        <select value={tlStockId} onChange={e => setTlStockId(e.target.value)}
          className="bg-panel-elevated border border-border-subtle rounded-lg px-3 py-1.5 text-xs text-text-primary focus:outline-none focus:border-primary/50">
          {stocks.map(s => <option key={s.id} value={s.id}>{s.name} ({s.code})</option>)}
        </select>
        {tlStock && <span className="text-xs text-text-muted">現在スコア: <span className="text-primary font-mono font-bold">{tlStock.score}</span></span>}
      </div>
      <div style={{height:260}} aria-label="スコア推移タイムラインチャート" role="img">
        <ResponsiveContainer width="100%" height="100%">
          <ComposedChart data={tlData}>
            <defs>
              <linearGradient id="tlPriceGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="5%" stopColor="#06B6D4" stopOpacity={0.25}/>
                <stop offset="95%" stopColor="#06B6D4" stopOpacity={0}/>
              </linearGradient>
            </defs>
            <CartesianGrid strokeDasharray="3 3" stroke="rgba(148,163,184,0.06)"/>
            <XAxis dataKey="date" tick={{fontSize:10,fill:'#8896AB'}} axisLine={false} tickLine={false}/>
            <YAxis yAxisId="left" domain={[0, 100]} tick={{fontSize:10,fill:'#4C6EF5'}} axisLine={false} tickLine={false} label={{value:'Score', angle:-90, position:'insideLeft', style:{fontSize:10,fill:'#4C6EF5'}}}/>
            <YAxis yAxisId="right" orientation="right" tick={{fontSize:10,fill:'#06B6D4'}} axisLine={false} tickLine={false} label={{value:'Price (idx)', angle:90, position:'insideRight', style:{fontSize:10,fill:'#06B6D4'}}}/>
            <Tooltip contentStyle={{background:'#141821',border:'1px solid rgba(148,163,184,0.15)',borderRadius:8,fontSize:11}}/>
            <Legend formatter={(v) => <span style={{color:'#94A3B8',fontSize:11}}>{v}</span>}/>
            <Area yAxisId="right" type="monotone" dataKey="price" stroke="#06B6D4" fill="url(#tlPriceGrad)" strokeWidth={1.5} name="株価指数"/>
            <Line yAxisId="left" type="monotone" dataKey="score" stroke="#4C6EF5" strokeWidth={2} dot={{fill:'#4C6EF5',r:3}} activeDot={{r:5,fill:'#4C6EF5'}} name="スコア"/>
          </ComposedChart>
        </ResponsiveContainer>
      </div>
    </div>
  );
}

function SettingsTab({ state, dispatch }) {
  const { scoringWeights, alertRules, alerts } = state;
  const [newRule, setNewRule] = React.useState({ stock: '', condition: 'score_below', value: '50', severity: 'warning' });
  const [dragOver, setDragOver] = React.useState(false);
  const fileRef = React.useRef(null);

  const weightLabels = {
    revenueGrowth: '売上成長',
    opGrowth: '営業利益成長',
    cfGrowth: 'CF成長',
    per: 'PER評価',
    momentum: 'モメンタム',
  };

  const handleExport = () => {
    const data = { holdings: state.holdings, memos: state.memos, scoringWeights: state.scoringWeights, alertRules: state.alertRules };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `dashboard-export-${new Date().toISOString().slice(0,10)}.json`;
    a.click(); URL.revokeObjectURL(url);
  };

  const handleImport = (text) => {
    try {
      const data = JSON.parse(text);
      dispatch({ type: 'IMPORT_DATA', payload: data });
      alert('データをインポートしました');
    } catch { alert('JSONパースエラー'); }
  };

  const handleFile = (e) => {
    const file = e.target.files?.[0];
    if (file) { const reader = new FileReader(); reader.onload = (ev) => handleImport(ev.target.result); reader.readAsText(file); }
  };

  const handleDrop = (e) => {
    e.preventDefault(); setDragOver(false);
    const file = e.dataTransfer.files?.[0];
    if (file) { const reader = new FileReader(); reader.onload = (ev) => handleImport(ev.target.result); reader.readAsText(file); }
  };

  const addAlertRule = () => {
    if (!newRule.stock) return;
    dispatch({ type: 'ADD_ALERT_RULE', payload: { ...newRule, id: Date.now().toString(), createdAt: new Date().toISOString() } });
    setNewRule({ stock: '', condition: 'score_below', value: '50', severity: 'warning' });
  };

  // Simulate some alerts
  const mockAlerts = [
    { id: '1', time: '2026-04-10 09:30', stock: '日本通信', message: 'スコアが80を超過', severity: 'info' },
    { id: '2', time: '2026-04-09 15:00', stock: 'BASE', message: '株価が5%下落', severity: 'warning' },
    { id: '3', time: '2026-04-08 10:15', stock: 'Finatext HD', message: 'PERが50を超過', severity: 'danger' },
  ];

  return (
    <div className="animate-fadeUp space-y-4">
      {/* Score Tuning */}
      <CollapsibleSection title="スコアリング重み調整" icon="⚖️">
        <div className="space-y-4">
          {Object.entries(weightLabels).map(([key, label]) => (
            <div key={key}>
              <div className="flex items-center justify-between mb-1">
                <span className="text-xs text-text-secondary">{label}</span>
                <span className="text-xs font-mono text-primary">{(scoringWeights[key] || 1.0).toFixed(1)}x</span>
              </div>
              <input type="range" min="0" max="2" step="0.1" value={scoringWeights[key] || 1.0}
                onChange={e => dispatch({type:'SET_WEIGHTS', payload:{[key]: parseFloat(e.target.value)}})}
                className="w-full"/>
            </div>
          ))}
          <button onClick={() => dispatch({type:'SET_WEIGHTS', payload:{revenueGrowth:1,opGrowth:1,cfGrowth:1,per:1,momentum:1}})}
            className="text-xs px-3 py-1.5 rounded-lg bg-panel-elevated hover:bg-panel-hover text-text-muted">
            🔄 デフォルトに戻す
          </button>
        </div>
      </CollapsibleSection>

      {/* Import/Export */}
      <CollapsibleSection title="データ管理" icon="💾">
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <button onClick={handleExport}
              className="w-full py-3 rounded-lg bg-primary/20 text-primary hover:bg-primary/30 transition-colors text-sm font-semibold border border-primary/20">
              📤 エクスポート (JSON)
            </button>
          </div>
          <div>
            <div onDragOver={e => { e.preventDefault(); setDragOver(true); }}
              onDragLeave={() => setDragOver(false)}
              onDrop={handleDrop}
              onClick={() => fileRef.current?.click()}
              className={`w-full py-3 rounded-lg text-center text-sm cursor-pointer transition-colors border-2 border-dashed ${
                dragOver ? 'border-primary bg-primary/10 text-primary' : 'border-border-subtle bg-panel text-text-muted hover:border-primary/30'
              }`}>
              📥 インポート（クリックまたはドラッグ）
            </div>
            <input ref={fileRef} type="file" accept=".json" onChange={handleFile} className="hidden"/>
          </div>
        </div>
        <div className="mt-3 p-3 bg-panel-elevated rounded-lg">
          <div className="text-[10px] text-text-muted">💡 エクスポートデータには、保有情報・メモ・スコアリング設定・アラートルールが含まれます。</div>
        </div>
      </CollapsibleSection>

      {/* Alert Rule Manager */}
      <CollapsibleSection title="アラートルール管理" icon="🔔">
        <div className="flex gap-2 mb-3 flex-wrap items-end">
          <div>
            <label className="text-[10px] text-text-muted block mb-0.5">銘柄</label>
            <select value={newRule.stock} onChange={e => setNewRule({...newRule, stock: e.target.value})}
              className="bg-panel-elevated border border-border-subtle rounded-lg px-2 py-1.5 text-xs text-text-primary focus:outline-none">
              <option value="">選択...</option>
              {state.stocks.map(s => <option key={s.id} value={s.name}>{s.name}</option>)}
            </select>
          </div>
          <div>
            <label className="text-[10px] text-text-muted block mb-0.5">条件</label>
            <select value={newRule.condition} onChange={e => setNewRule({...newRule, condition: e.target.value})}
              className="bg-panel-elevated border border-border-subtle rounded-lg px-2 py-1.5 text-xs text-text-primary focus:outline-none">
              <option value="score_below">スコア未満</option>
              <option value="score_above">スコア超過</option>
              <option value="price_drop">株価下落(%)</option>
              <option value="per_above">PER超過</option>
            </select>
          </div>
          <div>
            <label className="text-[10px] text-text-muted block mb-0.5">閾値</label>
            <input value={newRule.value} onChange={e => setNewRule({...newRule, value: e.target.value})}
              className="bg-panel-elevated border border-border-subtle rounded-lg px-2 py-1.5 text-xs text-text-primary w-20 focus:outline-none"/>
          </div>
          <div>
            <label className="text-[10px] text-text-muted block mb-0.5">重要度</label>
            <select value={newRule.severity} onChange={e => setNewRule({...newRule, severity: e.target.value})}
              className="bg-panel-elevated border border-border-subtle rounded-lg px-2 py-1.5 text-xs text-text-primary focus:outline-none">
              <option value="info">情報</option>
              <option value="warning">警告</option>
              <option value="danger">危険</option>
            </select>
          </div>
          <button onClick={addAlertRule}
            className="px-3 py-1.5 rounded-lg bg-primary text-white text-xs hover:bg-primary/90 transition-colors">
            ＋ 追加
          </button>
        </div>
        {alertRules.length > 0 ? (
          <div className="space-y-2">
            {alertRules.map((r, i) => (
              <div key={r.id || i} className="flex items-center justify-between p-2 bg-panel-elevated rounded-lg">
                <div className="flex items-center gap-2">
                  <Badge tone={r.severity === 'danger' ? 'exclude' : r.severity === 'warning' ? 'warning' : 'info'} size="sm">
                    {r.severity === 'danger' ? '🔴' : r.severity === 'warning' ? '🟡' : '🔵'}
                  </Badge>
                  <span className="text-xs">{r.stock}: {r.condition} {r.value}</span>
                </div>
                <button onClick={() => dispatch({type:'DELETE_ALERT_RULE', payload: i})}
                  aria-label={`アラートルール「${r.stock}: ${r.condition} ${r.value}」を削除`}
                  className="text-xs text-danger hover:text-danger/80 px-2">✕</button>
              </div>
            ))}
          </div>
        ) : (
          <div className="text-center py-4 text-xs text-text-muted">ルール未設定</div>
        )}
      </CollapsibleSection>

      {/* Alert Center */}
      <CollapsibleSection title="アラート履歴" icon="📋">
        <div className="space-y-2" aria-live="polite">
          {mockAlerts.map(a => (
            <div key={a.id} className={`flex items-center gap-3 p-3 rounded-lg border ${
              a.severity === 'danger' ? 'bg-danger/5 border-danger/20' :
              a.severity === 'warning' ? 'bg-amber/5 border-amber/20' :
              'bg-primary/5 border-primary/20'
            }`}>
              <span className="text-lg">{a.severity==='danger'?'🔴':a.severity==='warning'?'🟡':'🔵'}</span>
              <div className="flex-1">
                <div className="text-xs font-semibold">{a.stock}: {a.message}</div>
                <div className="text-[10px] text-text-muted">{a.time}</div>
              </div>
              <Badge tone={a.severity === 'danger' ? 'exclude' : a.severity === 'warning' ? 'warning' : 'info'} size="sm">
                {a.severity === 'danger' ? '危険' : a.severity === 'warning' ? '警告' : '情報'}
              </Badge>
            </div>
          ))}
        </div>
      </CollapsibleSection>
    </div>
  );
}

/* ==============================
   MAIN APP
   ============================== */
function App() {
  const [state, dispatch] = React.useReducer(reducer, initialState);

  // Debounced localStorage persistence (300ms)
  React.useEffect(() => {
    const timer = setTimeout(() => {
      saveLS('holdings', state.holdings);
      saveLS('memos', state.memos);
      saveLS('scoringWeights', state.scoringWeights);
      saveLS('alerts', state.alerts);
      saveLS('alertRules', state.alertRules);
    }, 300);
    return () => clearTimeout(timer);
  }, [state.holdings, state.memos, state.scoringWeights, state.alerts, state.alertRules]);

  const renderTab = () => {
    switch (state.activeTab) {
      case 'market': return <MarketTab state={state} dispatch={dispatch}/>;
      case 'portfolio': return <PortfolioTab state={state} dispatch={dispatch}/>;
      case 'navigator': return <NavigatorTab state={state} dispatch={dispatch}/>;
      case 'analysis': return <AnalysisTab state={state} dispatch={dispatch}/>;
      case 'settings': return <SettingsTab state={state} dispatch={dispatch}/>;
      default: return null;
    }
  };

  return (
    <div className="min-h-screen bg-canvas-deep">
      {/* Skip Navigation */}
      <a href="#main-content" className="skip-nav">メインコンテンツへスキップ</a>
      {/* Header */}
      <header className="sticky top-0 z-40 bg-canvas-deep/90 backdrop-blur-md border-b border-border-subtle">
        <div className="max-w-7xl mx-auto px-2 sm:px-4 py-2 sm:py-3">
          <div className="flex items-center justify-between mb-2">
            <div className="flex items-center gap-3">
              <span className="text-xl">📊</span>
              <div>
                <h1 className="text-sm font-bold tracking-tight">投資ナビゲーター</h1>
                <span className="text-[10px] text-text-muted">Dashboard v3</span>
              </div>
            </div>
            <div className="flex items-center gap-2">
              <span className="w-1.5 h-1.5 rounded-full bg-positive"></span>
              <span className="text-[10px] text-text-muted">Mock Mode</span>
            </div>
          </div>
          {/* Tab Navigation */}
          <nav className="flex gap-0.5 sm:gap-1 overflow-x-auto scrollbar-hide -mx-1 px-1 pb-0.5" role="tablist">
            {TABS.map(tab => (
              <button key={tab.id} id={`tab-${tab.id}`} role="tab" aria-selected={state.activeTab === tab.id}
                aria-controls="main-content" tabIndex={state.activeTab === tab.id ? 0 : -1}
                onClick={() => dispatch({type:'SET_TAB', payload: tab.id})}
                className={`tab-btn ${state.activeTab === tab.id ? 'active' : ''}`}>
                <span className="mr-1.5">{tab.icon}</span>{tab.label}
              </button>
            ))}
          </nav>
        </div>
      </header>

      {/* Content */}
      <main id="main-content" className="max-w-7xl mx-auto px-2 sm:px-4 py-2 sm:py-4" role="tabpanel" aria-labelledby={`tab-${state.activeTab}`}>
        <div key={state.activeTab} className="tab-content-enter">
          {renderTab()}
        </div>
      </main>

      {/* Footer */}
      <footer className="text-center py-4 text-[10px] text-text-muted border-t border-border-subtle mt-8">
        投資ナビゲーター Dashboard v3 — Mock Data Mode — © 2025
      </footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
