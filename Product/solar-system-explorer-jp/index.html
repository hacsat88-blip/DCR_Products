<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solar System Explorer</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap");

      :root {
        color-scheme: dark;
        --space-void: #02040a;
        --space-blue: rgba(70, 112, 202, 0.2);
        --glass-border: rgba(164, 194, 255, 0.28);
        --glass-fill: rgba(6, 10, 22, 0.68);
        --text-main: #f4f7ff;
        --text-muted: rgba(225, 234, 255, 0.72);
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background:
          radial-gradient(circle at top, rgba(70, 112, 202, 0.14), transparent 36%),
          radial-gradient(circle at 20% 20%, rgba(225, 121, 84, 0.08), transparent 22%),
          linear-gradient(180deg, #07111f 0%, var(--space-void) 36%, #010204 100%);
        font-family: "Space Grotesk", "Segoe UI", sans-serif;
      }

      body::before {
        position: fixed;
        inset: 0;
        content: "";
        background:
          radial-gradient(circle at 75% 24%, rgba(104, 149, 255, 0.1), transparent 18%),
          radial-gradient(circle at 25% 75%, rgba(255, 170, 122, 0.08), transparent 16%);
        pointer-events: none;
      }

      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }

      #scene-root {
        width: 100%;
        height: 100%;
      }

      #scene-root canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      #ui-root {
        position: absolute;
        inset: 24px;
        z-index: 2;
        pointer-events: none;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 24px;
      }

      .scene-panel {
        max-width: 320px;
        padding: 18px 20px;
        border: 1px solid var(--glass-border);
        border-radius: 18px;
        background: linear-gradient(180deg, rgba(14, 22, 44, 0.8), var(--glass-fill));
        box-shadow:
          0 28px 80px rgba(0, 0, 0, 0.44),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(18px);
        color: var(--text-main);
        pointer-events: auto;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #8db3ff;
        font-size: 0.73rem;
        font-weight: 700;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      .scene-panel h1 {
        margin: 0 0 10px;
        font-size: 1.6rem;
        line-height: 1.05;
      }

      .scene-panel p {
        margin: 0;
        color: var(--text-muted);
        font-size: 0.95rem;
        line-height: 1.55;
      }

      .scene-chip-row {
        display: flex;
        gap: 10px;
        margin-top: 16px;
      }

      .scene-chip {
        padding: 8px 12px;
        border: 1px solid rgba(151, 180, 255, 0.24);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.04);
        color: rgba(240, 246, 255, 0.86);
        font-size: 0.74rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      #control-bar {
        margin-top: 18px;
        display: grid;
        gap: 10px;
      }

      #control-bar select,
      #control-bar button {
        min-height: 46px;
        padding: 0 14px;
        border: 1px solid rgba(151, 180, 255, 0.24);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.06);
        color: var(--text-main);
        font: inherit;
        font-size: 0.92rem;
        transition:
          border-color 180ms ease,
          background 180ms ease,
          opacity 180ms ease;
      }

      #control-bar select {
        appearance: none;
        cursor: pointer;
      }

      #control-bar button {
        cursor: pointer;
      }

      #control-bar button[data-mode="real"] {
        border-color: rgba(255, 189, 116, 0.36);
        background: rgba(255, 184, 107, 0.14);
      }

      #control-bar select:disabled,
      #control-bar button:disabled {
        cursor: wait;
        opacity: 0.66;
      }

      .planet-popup {
        width: min(360px, calc(100vw - 48px));
        opacity: 0;
        transform: translateX(24px);
        transition:
          opacity 220ms ease,
          transform 220ms ease;
        visibility: hidden;
      }

      .planet-popup[data-open="true"] {
        opacity: 1;
        transform: translateX(0);
        visibility: visible;
      }

      .planet-popup .scene-panel {
        position: relative;
        max-width: none;
        min-height: 280px;
        max-height: min(78vh, 760px);
        overflow-y: auto;
        overscroll-behavior: contain;
      }

      .panel-close {
        position: absolute;
        top: 14px;
        right: 14px;
        width: 38px;
        height: 38px;
        border: 1px solid rgba(168, 194, 255, 0.24);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.05);
        color: var(--text-main);
        font: inherit;
        font-size: 1.2rem;
        line-height: 1;
        cursor: pointer;
      }

      .panel-close:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .popup-copy {
        margin-bottom: 18px;
        padding-right: 44px;
      }

      .popup-title {
        margin: 0;
        font-size: 2rem;
        line-height: 1;
      }

      .popup-subtitle {
        margin: 10px 0 0;
        color: var(--text-muted);
        font-size: 0.95rem;
        line-height: 1.5;
      }

      .popup-section + .popup-section {
        margin-top: 18px;
      }

      .popup-label {
        margin: 0 0 10px;
        color: #8db3ff;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .popup-list {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 8px;
      }

      .popup-list li {
        padding: 10px 12px;
        border: 1px solid rgba(151, 180, 255, 0.16);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.04);
        color: rgba(244, 247, 255, 0.92);
        font-size: 0.95rem;
      }

      .popup-toggle {
        margin-top: 12px;
        padding: 10px 14px;
        border: 1px solid rgba(151, 180, 255, 0.24);
        border-radius: 999px;
        background: rgba(99, 142, 255, 0.12);
        color: #d9e6ff;
        font: inherit;
        font-size: 0.82rem;
        font-weight: 500;
        letter-spacing: 0.04em;
        cursor: pointer;
      }

      .popup-toggle[hidden] {
        display: none;
      }

      .popup-empty {
        color: var(--text-muted);
        font-size: 0.92rem;
      }

      .popup-description {
        margin: 0;
        color: rgba(240, 245, 255, 0.9);
        font-size: 0.95rem;
        line-height: 1.75;
      }

      @media (max-width: 960px) {
        #ui-root {
          inset: 18px;
          flex-direction: column;
          align-items: stretch;
        }

        .scene-panel,
        .planet-popup {
          max-width: none;
          width: auto;
        }

        .planet-popup {
          transform: translateY(18px);
        }

        .planet-popup[data-open="true"] {
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="scene-root"></div>
      <aside id="ui-root">
        <section class="scene-panel" aria-label="太陽系ビュー">
          <p class="eyebrow">太陽系</p>
          <h1>太陽系エクスプローラー</h1>
          <p>
            8つの惑星を対数スケールで見渡しつつ、模様や大気の様子まで観察しやすい図鑑寄りの太陽系ビューです。ドラッグで回転、ホイールでズームできます。
          </p>
          <div class="scene-chip-row">
            <span class="scene-chip">表示スケール</span>
            <span class="scene-chip">8惑星</span>
            <span class="scene-chip">星空背景</span>
          </div>
          <div id="control-bar">
            <select id="planet-select">
              <option value="">惑星を選択</option>
            </select>
            <button id="scale-toggle">リアルスケール</button>
            <button id="reset-view">デフォルト表示に戻す</button>
          </div>
        </section>
        <aside id="planet-popup" class="planet-popup" data-open="false" aria-hidden="true">
          <section class="scene-panel" aria-label="惑星の詳細">
            <button id="popup-close" class="panel-close" type="button" aria-label="惑星の詳細を閉じる">×</button>
            <div class="popup-copy">
              <p class="eyebrow">惑星フォーカス</p>
              <h2 id="popup-title" class="popup-title">惑星</h2>
              <p id="popup-subtitle" class="popup-subtitle">惑星を選ぶと、衛星や組成、特徴を詳しく見られます。</p>
            </div>
            <div class="popup-section">
              <p class="popup-label">主要衛星</p>
              <ul id="popup-moons" class="popup-list"></ul>
              <button id="popup-toggle-moons" class="popup-toggle" type="button" hidden>全衛星を見る</button>
            </div>
            <div class="popup-section">
              <p class="popup-label">主な組成</p>
              <ul id="popup-composition" class="popup-list"></ul>
            </div>
            <div class="popup-section">
              <p class="popup-label">特徴</p>
              <p id="popup-description" class="popup-description"></p>
            </div>
          </section>
        </aside>
      </aside>
    </div>
    <script type="importmap">

    </script>

          moons: ["タイタン", "レア", "イアペトゥス", "ディオネ", "テティス", "エンケラドゥス", "ミマス"],

          description:
            "淡い金色の雲と壮大な環で知られるガス惑星です。環は氷と岩の粒から成り、近づくほど幾重にも分かれた繊細な構造が見えてきます。",
          focusDistance: 1.04,
        },
        {
          id: "uranus",
          name: "天王星",
          orbitAu: 19.191,
          orbitPeriodDays: 30688.5,
          meshRadius: 0.54,
          colorFallback: "#83d3de",
          roughness: 0.62,
          textureUrl: "https://raw.githubusercontent.com/jeromeetienne/threex.planets/3de707594b1178ba32c62199bf29efdf90f59cf0/images/uranusmap.jpg",
          moons: ["チタニア", "オベロン", "ウンブリエル", "アリエル", "ミランダ"],
          composition: ["水素", "ヘリウム", "水", "アンモニア", "メタン"],
          description:
            "青緑色の穏やかな見た目とは対照的に、自転軸が大きく横倒しになった特異な氷巨大惑星です。大気中のメタンが赤い光を吸収し、冷たい色合いを生みます。",
          focusDistance: 0.96,
        },
        {
          id: "neptune",
          name: "海王星",
          orbitAu: 30.07,
          orbitPeriodDays: 60182,
          meshRadius: 0.52,
          colorFallback: "#4b7dff",
          roughness: 0.66,
          textureUrl: "https://raw.githubusercontent.com/jeromeetienne/threex.planets/3de707594b1178ba32c62199bf29efdf90f59cf0/images/neptunemap.jpg",
          moons: ["トリトン", "プロテウス", "ネレイド"],
          composition: ["水素", "ヘリウム", "水", "アンモニア", "メタン"],
          description:
            "濃い群青色が印象的な最遠の氷巨大惑星で、太陽系でも屈指の強風が吹き荒れます。遠い世界でありながら、大気の縞や暗い嵐の痕跡がダイナミックに現れます。",
          focusDistance: 0.92,
        },
      ];

      const DAYS_PER_SECOND = 20;
      const STARFIELD_COUNT = 42000;
      const DEFAULT_CAMERA_POSITION = new THREE.Vector3(-18, 24, 54);
      const DEFAULT_CAMERA_TARGET = new THREE.Vector3(0, 0, 0);
      const textureLoader = new THREE.TextureLoader();

      const appState = {
        scaleMode: "display",
        selectedPlanetId: null,
        focusedPlanetId: null,
        isPopupOpen: false,
        isTransitioning: false,
        showAllMoons: false,
        defaultCameraPose: {
          position: DEFAULT_CAMERA_POSITION.clone(),
          target: DEFAULT_CAMERA_TARGET.clone(),
        },
      };
      const interactionState = {
        pointer: new THREE.Vector2(),
        pointerDownClient: new THREE.Vector2(),
        clickSnapshot: new Map(),
      };

      // Helpers
      function getVisibleMoons(planet, showAllMoons) {
        return showAllMoons ? planet.moons : planet.moons.slice(0, 5);
      }

      function getScaleToggleLabel(scaleMode) {
        return scaleMode === "display" ? "リアルスケール" : "表示スケール";
      }

      function getFocusOffset(planet) {
        return new THREE.Vector3(planet.focusDistance * 0.9, planet.focusDistance * 0.42, planet.focusDistance);
      }

      function tweenCameraToTarget(camera, controls, getDestinationPose, options = {}, onComplete = () => {}) {
        controls.enabled = false;
        const startPosition = camera.position.clone();
        const startTarget = controls.target.clone();
        const { lockTargetToDestination = false } = options;

        new Tween({ progress: 0 })
          .to({ progress: 1 }, 1400)
          .easing(Easing.Cubic.InOut)
          .onUpdate((frame) => {
            const destination = getDestinationPose();

            camera.position.lerpVectors(startPosition, destination.position, frame.progress);
            if (lockTargetToDestination) {
              controls.target.copy(destination.target);
            } else {
              controls.target.lerpVectors(startTarget, destination.target, frame.progress);
            }
            controls.update();
          })
          .onComplete(() => {
            const destination = getDestinationPose();

            camera.position.copy(destination.position);
            controls.target.copy(destination.target);
            controls.enabled = true;
            controls.update();
            onComplete();
          })
          .start();
      }

      function updatePlanetSnapshot(planetId, mesh) {
        interactionState.clickSnapshot.set(planetId, mesh.position.clone());
      }

      function getPointerTravelDistanceSq(startPoint, endX, endY) {
        const dx = endX - startPoint.x;
        const dy = endY - startPoint.y;

        return dx * dx + dy * dy;
      }

      function areVectorsClose(left, right, epsilon = 1e-4) {
        return left.distanceToSquared(right) <= epsilon * epsilon;
      }

      function getScaledOrbitRadius(planet, scaleMode) {
        if (scaleMode === "real") {
          return planet.orbitAu * 6.5;
        }

        return Math.log(planet.orbitAu + 1) * 14;
      }

      function computeOrbitPosition(planet, elapsedDays, scaleMode) {
        const angle = (elapsedDays / planet.orbitPeriodDays) * Math.PI * 2;
        const radius = getScaledOrbitRadius(planet, scaleMode);

        return new THREE.Vector3(Math.cos(angle) * radius, 0, Math.sin(angle) * radius);
      }

      function buildOrbitLineVertices(planets, scaleMode, segments = 160) {
        const vertices = [];

        planets.forEach((planet) => {
          const radius = getScaledOrbitRadius(planet, scaleMode);

          for (let index = 0; index < segments; index += 1) {
            const a0 = (index / segments) * Math.PI * 2;
            const a1 = ((index + 1) / segments) * Math.PI * 2;
            vertices.push(Math.cos(a0) * radius, 0, Math.sin(a0) * radius);
            vertices.push(Math.cos(a1) * radius, 0, Math.sin(a1) * radius);
          }
        });

        return new Float32Array(vertices);
      }

      function rebuildOrbitGeometry(planets, scaleMode, orbitGeometry) {
        const vertices = buildOrbitLineVertices(planets, scaleMode);
        orbitGeometry.setAttribute("position", new THREE.BufferAttribute(vertices, 3));
        orbitGeometry.attributes.position.needsUpdate = true;
        orbitGeometry.computeBoundingSphere();
      }

      function buildStarfieldLayerConfig(totalStars) {
        const layerTemplates = [
          { weight: 13, minRadius: 160, maxRadius: 680, size: 0.34, opacity: 0.35, yScale: 0.7 },
          { weight: 6, minRadius: 320, maxRadius: 980, size: 0.8, opacity: 0.58, yScale: 0.82 },
          { weight: 2, minRadius: 560, maxRadius: 1380, size: 1.45, opacity: 0.84, yScale: 0.96 },
        ];
        const totalWeight = layerTemplates.reduce((sum, layer) => sum + layer.weight, 0);
        let assignedStars = 0;

        return layerTemplates.map((layer, index) => {
          const count =
            index === layerTemplates.length - 1
              ? totalStars - assignedStars
              : Math.floor((totalStars * layer.weight) / totalWeight);

          assignedStars += count;

          return {
            count,
            minRadius: layer.minRadius,
            maxRadius: layer.maxRadius,
            size: layer.size,
            opacity: layer.opacity,
            yScale: layer.yScale,
          };
        });
      }

      // Assets
      function createFallbackPlanetMaterial(planet) {
        return new THREE.MeshStandardMaterial({
          color: new THREE.Color(planet.colorFallback),
          roughness: Math.min(planet.roughness, 0.8),
          metalness: 0.04,
          emissive: new THREE.Color(planet.colorFallback).multiplyScalar(0.08),
          emissiveIntensity: 0.35,
        });
      }

      function applyPlanetTextureAsync(planet, material, loader) {
        loader.load(
          planet.textureUrl,
          (texture) => {
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.anisotropy = 8;
            material.color.set(0xffffff);
            material.map = texture;
            material.roughness = Math.min(planet.roughness * 0.82, 0.74);
            material.emissive.set("#1f2434");
            material.emissiveIntensity = 0.12;
            material.needsUpdate = true;
          },
          undefined,
          () => {
            material.color.set(planet.colorFallback);
            material.map = null;
            material.roughness = Math.min(planet.roughness, 0.8);
            material.emissive.set(new THREE.Color(planet.colorFallback).multiplyScalar(0.08));
            material.emissiveIntensity = 0.35;
            material.needsUpdate = true;
          }
        );
      }

      function getPlanetFocusPose(entry) {
        const target = entry.mesh.position.clone();
        const position = target.clone().add(getFocusOffset(entry.planet));

        return { position, target };
      }

      function createPlanetMesh(planet) {
        const geometry = new THREE.SphereGeometry(planet.meshRadius, 48, 48);
        const material = createFallbackPlanetMaterial(planet);
        const mesh = new THREE.Mesh(geometry, material);

        mesh.castShadow = false;
        mesh.receiveShadow = false;
        mesh.userData.planetId = planet.id;

        applyPlanetTextureAsync(planet, material, textureLoader);

        return mesh;
      }

      // Runtime
      class SolarSystemRuntime {
        constructor(scene) {
          this.scene = scene;
          this.starfieldGroup = new THREE.Group();
          this.sunGroup = new THREE.Group();
          this.orbitGroup = new THREE.Group();
          this.planetGroup = new THREE.Group();
          this.planetEntries = [];
          this.planetMeshRegistry = new Map();
          this.orbitLine = null;
          this.starfieldCount = 0;
        }

        init() {
          this.createStarfield();
          this.createSun();
          this.createOrbitLines();
          this.createPlanets();
          this.scene.add(this.starfieldGroup, this.sunGroup, this.orbitGroup, this.planetGroup);
        }

        createStarfield() {
          const layers = buildStarfieldLayerConfig(STARFIELD_COUNT);
          const warm = new THREE.Color("#ffd5ad");
          const cool = new THREE.Color("#9ec7ff");
          const white = new THREE.Color("#f8fbff");

          this.starfieldCount = layers.reduce((total, layer) => total + layer.count, 0);

          layers.forEach((layer) => {
            const positions = new Float32Array(layer.count * 3);
            const colors = new Float32Array(layer.count * 3);

            for (let index = 0; index < layer.count; index += 1) {
              const radius = layer.minRadius + Math.random() ** 1.35 * (layer.maxRadius - layer.minRadius);
              const theta = Math.random() * Math.PI * 2;
              const phi = Math.acos(1 - Math.random() * 2);
              const offset = index * 3;
              const tintSource = Math.random() > 0.83 ? warm : cool;
              const tint = tintSource.clone().lerp(white, Math.random() * 0.86);
              const brightness = 0.44 + Math.random() * 0.56;

              positions[offset] = radius * Math.sin(phi) * Math.cos(theta);
              positions[offset + 1] = radius * Math.cos(phi) * layer.yScale;
              positions[offset + 2] = radius * Math.sin(phi) * Math.sin(theta);
              colors[offset] = tint.r * brightness;
              colors[offset + 1] = tint.g * brightness;
              colors[offset + 2] = tint.b * brightness;
            }

            const geometry = new THREE.BufferGeometry();

            geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
              size: layer.size,
              sizeAttenuation: true,
              transparent: true,
              opacity: layer.opacity,
              vertexColors: true,
              depthWrite: false,
              blending: THREE.AdditiveBlending,
            });

            this.starfieldGroup.add(new THREE.Points(geometry, material));
          });
        }

        createSun() {
          const sunBody = new THREE.Mesh(
            new THREE.SphereGeometry(2.6, 64, 64),
            new THREE.MeshStandardMaterial({
              color: "#ffd27d",
              emissive: "#ff9b3d",
              emissiveIntensity: 2.6,
              roughness: 0.82,
              metalness: 0.02,
            })
          );
          const sunGlow = new THREE.Mesh(
            new THREE.SphereGeometry(3.5, 48, 48),
            new THREE.MeshBasicMaterial({
              color: "#ffb35c",
              transparent: true,
              opacity: 0.18,
            })
          );
          const solarHaloInner = new THREE.Mesh(
            new THREE.SphereGeometry(4.8, 48, 48),
            new THREE.MeshBasicMaterial({
              color: "#ffcf84",
              transparent: true,
              opacity: 0.12,
              depthWrite: false,
            })
          );
          const solarHaloOuter = new THREE.Mesh(
            new THREE.SphereGeometry(7.1, 48, 48),
            new THREE.MeshBasicMaterial({
              color: "#ff9448",
              transparent: true,
              opacity: 0.055,
              depthWrite: false,
            })
          );
          const sunLight = new THREE.PointLight("#ffd18f", 42, 0, 2);

          this.sunGroup.add(sunBody, sunGlow, solarHaloInner, solarHaloOuter, sunLight);
        }

        createOrbitLines() {
          const orbitGeometry = new THREE.BufferGeometry();
          rebuildOrbitGeometry(PLANET_DATA, appState.scaleMode, orbitGeometry);

          const orbitMaterial = new THREE.LineBasicMaterial({
            color: "#83a9ff",
            transparent: true,
            opacity: 0.24,
          });

          this.orbitLine = new THREE.LineSegments(orbitGeometry, orbitMaterial);
          this.orbitGroup.add(this.orbitLine);
        }

        createPlanets() {
          const orbitalPhaseFractions = [0.08, 0.39, 0.0, 0.63, 0.16, 0.45, 0.72, 0.88];

          this.planetEntries = PLANET_DATA.map((planet, index) => {
            const mesh = createPlanetMesh(planet);
            const orbitDayOffset = planet.orbitPeriodDays * orbitalPhaseFractions[index];

            this.planetGroup.add(mesh);
            this.planetMeshRegistry.set(planet.id, mesh);

            return {
              planet,
              mesh,
              orbitDayOffset,
            };
          });
        }

        getPlanetEntry(planetId) {
          return this.planetEntries.find((entry) => entry.planet.id === planetId) ?? null;
        }

        setScaleMode(scaleMode, elapsedDays) {
          if (!(this.orbitLine?.geometry instanceof THREE.BufferGeometry)) {
            return;
          }

          rebuildOrbitGeometry(
            this.planetEntries.map((entry) => entry.planet),
            scaleMode,
            this.orbitLine.geometry
          );
          this.update(elapsedDays);
        }

        update(elapsedDays) {
          this.planetEntries.forEach((entry) => {
            const { planet, mesh, orbitDayOffset } = entry;
            const nextPosition = computeOrbitPosition(planet, elapsedDays + orbitDayOffset, appState.scaleMode);

            mesh.position.copy(nextPosition);
            mesh.rotation.y += planet.id === "earth" ? 0.012 : 0.009;
            updatePlanetSnapshot(planet.id, mesh);
          });

          this.sunGroup.rotation.y += 0.0018;
        }
      }

      class InteractionManager {
        constructor({ canvas, camera, runtime, onPlanetSelect, onEmptySpace }) {
          this.canvas = canvas;
          this.camera = camera;
          this.runtime = runtime;
          this.onPlanetSelect = onPlanetSelect;
          this.onEmptySpace = onEmptySpace;
          this.raycaster = new THREE.Raycaster();
          this.hitSphere = new THREE.Sphere();
          this.hitPoint = new THREE.Vector3();
          this.clickDragThresholdSq = 36;

          this.handleCanvasClick = this.handleCanvasClick.bind(this);
          this.handlePointerDown = this.handlePointerDown.bind(this);
          this.canvas.addEventListener("pointerdown", this.handlePointerDown);
          this.canvas.addEventListener("click", this.handleCanvasClick);
        }

        normalizePointer(event) {
          const bounds = this.canvas.getBoundingClientRect();
          const x = ((event.clientX - bounds.left) / bounds.width) * 2 - 1;
          const y = -((event.clientY - bounds.top) / bounds.height) * 2 + 1;

          interactionState.pointer.set(x, y);
        }

        getSnapshotForClick() {
          const snapshot = new Map();

          interactionState.clickSnapshot.forEach((position, planetId) => {
            snapshot.set(planetId, position.clone());
          });

          return snapshot;
        }

        resolvePlanetHit(snapshot) {
          this.raycaster.setFromCamera(interactionState.pointer, this.camera);

          const hits = [];

          this.runtime.planetMeshRegistry.forEach((mesh, planetId) => {
            const snapshotPosition = snapshot.get(planetId);

            if (!snapshotPosition) {
              return;
            }

            if (!mesh.geometry.boundingSphere) {
              mesh.geometry.computeBoundingSphere();
            }

            this.hitSphere.center.copy(snapshotPosition);
            this.hitSphere.radius = mesh.geometry.boundingSphere?.radius ?? 0;

            const hit = this.raycaster.ray.intersectSphere(this.hitSphere, this.hitPoint);

            if (!hit) {
              return;
            }

            hits.push({
              planetId,
              distance: this.raycaster.ray.origin.distanceTo(hit),
            });
          });

          hits.sort((left, right) => left.distance - right.distance);

          return hits[0] ?? null;
        }

        handleCanvasClick(event) {
          if (appState.isTransitioning) {
            return;
          }

          if (getPointerTravelDistanceSq(interactionState.pointerDownClient, event.clientX, event.clientY) > this.clickDragThresholdSq) {
            return;
          }

          this.normalizePointer(event);

          const hit = this.resolvePlanetHit(this.getSnapshotForClick());

          if (hit) {
            this.onPlanetSelect(hit.planetId);
            return;
          }

          this.onEmptySpace();
        }

        handlePointerDown(event) {
          interactionState.pointerDownClient.set(event.clientX, event.clientY);
        }
      }

      class CameraDirector {
        constructor({ camera, controls, runtime }) {
          this.camera = camera;
          this.controls = controls;
          this.runtime = runtime;
          this.focusLock = null;
        }

        focusPlanet(planetId, onComplete = () => {}) {
          if (appState.isTransitioning) {
            return false;
          }

          const entry = this.runtime.getPlanetEntry(planetId);

          if (!entry) {
            return false;
          }

          appState.isTransitioning = true;
          appState.focusedPlanetId = null;
          this.focusLock = null;

          tweenCameraToTarget(this.camera, this.controls, () => getPlanetFocusPose(entry), { lockTargetToDestination: true }, () => {
            this.focusLock = {
              planetId,
              lastPlanetPosition: entry.mesh.position.clone(),
            };
            appState.focusedPlanetId = planetId;
            appState.isTransitioning = false;
            this.update();
            this.controls.update();
            onComplete(entry.planet);
          });

          return true;
        }

        resetToDefault(onComplete = () => {}) {
          if (appState.isTransitioning) {
            return false;
          }

          const { position, target } = appState.defaultCameraPose;

          if (!this.focusLock && appState.focusedPlanetId === null && areVectorsClose(this.camera.position, position) && areVectorsClose(this.controls.target, target)) {
            return false;
          }

          appState.isTransitioning = true;
          appState.focusedPlanetId = null;
          this.focusLock = null;

          tweenCameraToTarget(
            this.camera,
            this.controls,
            () => ({
              position,
              target,
            }),
            {},
            () => {
              appState.isTransitioning = false;
              this.controls.target.copy(target);
              this.camera.position.copy(position);
              this.controls.update();
              onComplete();
            }
          );

          return true;
        }

        update() {
          if (!this.focusLock || appState.isTransitioning) {
            return;
          }

          const entry = this.runtime.getPlanetEntry(this.focusLock.planetId);

          if (!entry) {
            return;
          }

          const nextPlanetPosition = entry.mesh.position.clone();
          const planetDelta = nextPlanetPosition.sub(this.focusLock.lastPlanetPosition);

          if (planetDelta.lengthSq() > 0) {
            this.controls.target.add(planetDelta);
            this.camera.position.add(planetDelta);
            this.focusLock.lastPlanetPosition.add(planetDelta);
          }
        }
      }

      class OverlayUI {
        constructor({ root, onRequestClose, onPlanetSelect, onScaleToggle }) {
          if (!(root instanceof HTMLElement)) {
            throw new Error("Missing #planet-popup root");
          }

          this.root = root;
          this.onRequestClose = onRequestClose;
          this.onPlanetSelect = onPlanetSelect;
          this.onScaleToggle = onScaleToggle;
          this.title = root.querySelector("#popup-title");
          this.subtitle = root.querySelector("#popup-subtitle");
          this.moons = root.querySelector("#popup-moons");
          this.composition = root.querySelector("#popup-composition");
          this.description = root.querySelector("#popup-description");
          this.toggleMoons = root.querySelector("#popup-toggle-moons");
          this.closeButton = root.querySelector("#popup-close");
          this.planetSelect = document.getElementById("planet-select");
          this.scaleToggle = document.getElementById("scale-toggle");
          this.resetButton = document.getElementById("reset-view");
          this.currentPlanet = null;

          if (!(this.title instanceof HTMLElement) || !(this.subtitle instanceof HTMLElement) || !(this.description instanceof HTMLElement)) {
            throw new Error("Popup heading nodes missing");
          }

          if (!(this.moons instanceof HTMLUListElement) || !(this.composition instanceof HTMLUListElement)) {
            throw new Error("Popup list nodes missing");
          }

          if (!(this.toggleMoons instanceof HTMLButtonElement) || !(this.closeButton instanceof HTMLButtonElement)) {
            throw new Error("Popup controls missing");
          }

          if (
            !(this.planetSelect instanceof HTMLSelectElement) ||
            !(this.scaleToggle instanceof HTMLButtonElement) ||
            !(this.resetButton instanceof HTMLButtonElement)
          ) {
            throw new Error("Control bar nodes missing");
          }

          this.handleCloseClick = this.handleCloseClick.bind(this);
          this.handleToggleMoons = this.handleToggleMoons.bind(this);
          this.handlePlanetSelectChange = this.handlePlanetSelectChange.bind(this);
          this.handleScaleToggleClick = this.handleScaleToggleClick.bind(this);
          this.handleResetClick = this.handleResetClick.bind(this);
          this.stopEventPropagation = this.stopEventPropagation.bind(this);

          this.populatePlanetOptions(PLANET_DATA);
          this.syncControlState();

          this.root.addEventListener("click", this.stopEventPropagation);
          this.root.addEventListener("pointerdown", this.stopEventPropagation);
          this.closeButton.addEventListener("click", this.handleCloseClick);
          this.toggleMoons.addEventListener("click", this.handleToggleMoons);
          this.planetSelect.addEventListener("change", this.handlePlanetSelectChange);
          this.scaleToggle.addEventListener("click", this.handleScaleToggleClick);
          this.resetButton.addEventListener("click", this.handleResetClick);
        }

        stopEventPropagation(event) {
          event.stopPropagation();
        }

        populatePlanetOptions(planets) {
          planets.forEach((planet) => {
            const option = document.createElement("option");
            option.value = planet.id;
            option.textContent = planet.name;
            this.planetSelect.append(option);
          });
        }

        syncControlState() {
          this.planetSelect.value = appState.selectedPlanetId ?? "";
          this.planetSelect.disabled = appState.isTransitioning;
          this.scaleToggle.disabled = appState.isTransitioning;
          this.resetButton.disabled = appState.isTransitioning;
          this.scaleToggle.textContent = getScaleToggleLabel(appState.scaleMode);
          this.scaleToggle.dataset.mode = appState.scaleMode;
          this.scaleToggle.setAttribute("aria-pressed", String(appState.scaleMode === "real"));
        }

        populateList(listElement, items, emptyLabel) {
          listElement.textContent = "";

          if (items.length === 0) {
            const emptyItem = document.createElement("li");
            emptyItem.textContent = emptyLabel;
            emptyItem.className = "popup-empty";
            listElement.append(emptyItem);
            return;
          }

          items.forEach((item) => {
            const listItem = document.createElement("li");
            listItem.textContent = item;
            listElement.append(listItem);
          });
        }

        syncPanelState() {
          if (!this.currentPlanet) {
            this.root.dataset.open = "false";
            this.root.setAttribute("aria-hidden", "true");
            this.toggleMoons.hidden = true;
            return;
          }

          const visibleMoons = getVisibleMoons(this.currentPlanet, appState.showAllMoons);
          const moonCount = this.currentPlanet.moons.length;

          this.title.textContent = this.currentPlanet.name;
          this.subtitle.textContent =
            moonCount > 0
              ? `このビューでは主要衛星を ${moonCount} 件追跡しています。`
              : "現在、この惑星に主要衛星は登録されていません。";
          this.populateList(this.moons, visibleMoons, "主要衛星は登録されていません");
          this.populateList(this.composition, this.currentPlanet.composition, "組成データはありません");
          this.description.textContent = this.currentPlanet.description;
          this.toggleMoons.hidden = moonCount <= 5;
          this.toggleMoons.textContent = appState.showAllMoons ? "表示をたたむ" : "全衛星を見る";
          this.root.dataset.open = "true";
          this.root.setAttribute("aria-hidden", "false");
        }

        open(planet) {
          this.currentPlanet = planet;
          appState.isPopupOpen = true;
          this.syncPanelState();
          this.syncControlState();
        }

        close() {
          this.currentPlanet = null;
          appState.isPopupOpen = false;
          appState.showAllMoons = false;
          this.syncPanelState();
          this.syncControlState();
        }

        handleCloseClick(event) {
          event.stopPropagation();
          this.onRequestClose();
        }

        handleToggleMoons(event) {
          event.stopPropagation();

          if (!this.currentPlanet) {
            return;
          }

          appState.showAllMoons = !appState.showAllMoons;
          this.syncPanelState();
        }

        handlePlanetSelectChange(event) {
          event.stopPropagation();

          if (!(event.currentTarget instanceof HTMLSelectElement)) {
            return;
          }

          if (!event.currentTarget.value) {
            this.onRequestClose();
            return;
          }

          this.onPlanetSelect(event.currentTarget.value);
        }

        handleScaleToggleClick(event) {
          event.stopPropagation();
          this.onScaleToggle();
        }

        handleResetClick(event) {
          event.stopPropagation();
          this.onRequestClose();
        }
      }

      // App
      class App {
        constructor(root) {
          this.root = root;
          this.clock = new THREE.Clock();
          this.scene = new THREE.Scene();
          this.camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 2000);
          this.camera.position.copy(DEFAULT_CAMERA_POSITION);
          this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
          this.controls = null;
          this.runtime = new SolarSystemRuntime(this.scene);
          this.overlayUI = null;
          this.cameraDirector = null;
          this.interactionManager = null;

          this.animate = this.animate.bind(this);
          this.handleResize = this.handleResize.bind(this);
          this.handlePlanetFocusRequest = this.handlePlanetFocusRequest.bind(this);
          this.handleScaleToggleRequest = this.handleScaleToggleRequest.bind(this);
          this.handleFocusDismissRequest = this.handleFocusDismissRequest.bind(this);
          this.syncUiState = this.syncUiState.bind(this);

          this.setupRenderer();
          this.setupScene();
          this.setupControls();
          this.runtime.init();
          this.runtime.update(0);
          this.setupInteraction();

          window.addEventListener("resize", this.handleResize);
          this.animate();
        }

        setupRenderer() {
          this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
          this.renderer.setSize(this.root.clientWidth, this.root.clientHeight);
          this.renderer.outputColorSpace = THREE.SRGBColorSpace;
          this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
          this.renderer.toneMappingExposure = 1.42;
          this.root.appendChild(this.renderer.domElement);
        }

        setupScene() {
          this.scene.background = new THREE.Color("#030712");
          this.scene.fog = new THREE.FogExp2("#07111f", 0.0036);

          const ambientLight = new THREE.HemisphereLight("#bfd6ff", "#24324f", 0.92);
          const fillLight = new THREE.DirectionalLight("#dfe8ff", 0.58);
          const rimLight = new THREE.DirectionalLight("#9fc4ff", 0.34);

          fillLight.position.set(-18, 12, 20);
          rimLight.position.set(16, 8, -18);
          this.scene.add(ambientLight, fillLight, rimLight);
        }

        setupControls() {
          this.controls = new OrbitControls(this.camera, this.renderer.domElement);
          this.controls.enableDamping = true;
          this.controls.dampingFactor = 0.055;
          this.controls.enablePan = false;
          this.controls.minDistance = 10;
          this.controls.maxDistance = 180;
          this.controls.rotateSpeed = 0.72;
          this.controls.target.copy(DEFAULT_CAMERA_TARGET);
          this.controls.update();
        }

        setupInteraction() {
          const popupRoot = document.getElementById("planet-popup");

          this.overlayUI = new OverlayUI({
            root: popupRoot,
            onRequestClose: this.handleFocusDismissRequest,
            onPlanetSelect: this.handlePlanetFocusRequest,
            onScaleToggle: this.handleScaleToggleRequest,
          });
          this.cameraDirector = new CameraDirector({
            camera: this.camera,
            controls: this.controls,
            runtime: this.runtime,
          });
          this.interactionManager = new InteractionManager({
            canvas: this.renderer.domElement,
            camera: this.camera,
            runtime: this.runtime,
            onPlanetSelect: this.handlePlanetFocusRequest,
            onEmptySpace: this.handleFocusDismissRequest,
          });
          this.syncUiState();
        }

        getElapsedDays() {
          return this.clock.getElapsedTime() * DAYS_PER_SECOND;
        }

        syncUiState() {
          this.overlayUI?.syncControlState();
        }

        handlePlanetFocusRequest(planetId) {
          if (appState.isTransitioning) {
            this.syncUiState();
            return false;
          }

          const entry = this.runtime.getPlanetEntry(planetId);

          if (!entry) {
            this.syncUiState();
            return false;
          }

          const isSwitchingPlanet = appState.selectedPlanetId !== planetId;

          if (isSwitchingPlanet) {
            appState.showAllMoons = false;
          }

          if (appState.focusedPlanetId === planetId && appState.isPopupOpen) {
            appState.selectedPlanetId = planetId;
            this.overlayUI.open(entry.planet);
            this.syncUiState();
            return true;
          }

          if (appState.isPopupOpen && appState.focusedPlanetId && appState.focusedPlanetId !== planetId) {
            this.overlayUI.close();
          }

          appState.selectedPlanetId = planetId;
          const didStart = this.cameraDirector.focusPlanet(planetId, (planet) => {
            this.overlayUI.open(planet);
            this.syncUiState();
          });

          this.syncUiState();

          if (!didStart) {
            appState.selectedPlanetId = appState.focusedPlanetId;
            this.syncUiState();
          }

          return didStart;
        }

        handleScaleToggleRequest() {
          if (appState.isTransitioning) {
            this.syncUiState();
            return false;
          }

          appState.scaleMode = appState.scaleMode === "display" ? "real" : "display";
          this.runtime.setScaleMode(appState.scaleMode, this.getElapsedDays());
          this.cameraDirector.update();
          this.controls.update();
          this.syncUiState();

          return true;
        }

        handleFocusDismissRequest() {
          if (appState.isTransitioning) {
            this.syncUiState();
            return false;
          }

          this.overlayUI.close();
          appState.selectedPlanetId = null;
          const didReset = this.cameraDirector.resetToDefault(() => {
            this.syncUiState();
          });

          this.syncUiState();

          if (!didReset) {
            this.syncUiState();
          }

          return didReset;
        }

        animate() {
          requestAnimationFrame(this.animate);

          const elapsedDays = this.clock.getElapsedTime() * DAYS_PER_SECOND;
          this.runtime.update(elapsedDays);
          updateTweens(performance.now());
          this.controls.update();
          this.cameraDirector.update();
          this.renderer.render(this.scene, this.camera);
        }

        handleResize() {
          const width = this.root.clientWidth;
          const height = this.root.clientHeight;

          this.camera.aspect = width / height;
          this.camera.updateProjectionMatrix();
          this.renderer.setSize(width, height);
        }
      }

      // Entry
      const sceneRoot = document.getElementById("scene-root");

      if (!(sceneRoot instanceof HTMLElement)) {
        throw new Error("Missing #scene-root mount target");
      }

      const app = new App(sceneRoot);
    </script>
  </body>
</html>
