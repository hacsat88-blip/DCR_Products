<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蒼星儀</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #000;
  overflow: hidden;
  font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
}

#canvas-container { width: 100vw; height: 100vh; }

/* ── Controls ── */
#controls {
  position: fixed;
  top: 20px;
  left: 20px;
  color: #fff;
  z-index: 10;
}

#controls h1 {
  font-size: 1.4rem;
  font-weight: 300;
  letter-spacing: 0.15em;
  text-shadow: 0 0 12px #4488ff, 0 0 24px #2244aa;
  margin-bottom: 12px;
}

.btn-group {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}

#region-select,
#category-filter {
  background: rgba(0, 10, 30, 0.7);
  color: #fff;
  border: 1px solid rgba(68, 136, 255, 0.3);
  border-radius: 4px;
  padding: 6px 10px;
  font-size: 0.85rem;
  outline: none;
  cursor: pointer;
}

#region-select:hover,
#category-filter:hover {
  border-color: rgba(68, 136, 255, 0.6);
}

#default-btn {
  background: rgba(34, 68, 170, 0.4);
  color: #fff;
  border: 1px solid rgba(68, 136, 255, 0.4);
  border-radius: 4px;
  padding: 6px 14px;
  font-size: 0.85rem;
  cursor: pointer;
  transition: background 0.2s;
}

#default-btn:hover { background: rgba(34, 68, 170, 0.6); }

/* ── Search ── */
#search-container {
  position: relative;
  margin-top: 10px;
}

#search-input {
  background: rgba(0, 10, 30, 0.7);
  color: #fff;
  border: 1px solid rgba(68, 136, 255, 0.3);
  border-radius: 4px;
  padding: 8px 12px;
  font-size: 0.85rem;
  width: 240px;
  outline: none;
}

#search-input:focus { border-color: rgba(68, 136, 255, 0.8); }
#search-input::placeholder { color: rgba(255,255,255,0.4); }

#search-results {
  position: absolute;
  top: 100%;
  left: 0;
  width: 240px;
  max-height: 240px;
  overflow-y: auto;
  background: rgba(0, 10, 30, 0.95);
  border: 1px solid rgba(68, 136, 255, 0.3);
  border-top: none;
  border-radius: 0 0 4px 4px;
  display: none;
  z-index: 20;
}

.search-item {
  padding: 8px 12px;
  font-size: 0.85rem;
  color: #ccc;
  cursor: pointer;
  border-bottom: 1px solid rgba(68, 136, 255, 0.1);
}

.search-item:hover { background: rgba(68, 136, 255, 0.2); color: #fff; }

/* ── Markers ── */
.marker {
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  pointer-events: auto;
  transition: transform 0.2s;
  position: relative;
}

.marker:hover { transform: scale(1.5); }

.marker::before {
  content: '';
  display: block;
  border-radius: 50%;
  animation: markerPulse 2s ease-in-out infinite;
}

@keyframes markerPulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

.marker.marker-city::before {
  width: 6px; height: 6px;
  background: #00ffff;
  box-shadow: 0 0 6px #00ffff, 0 0 12px rgba(0,255,255,0.4);
}

.marker.marker-city.pop-large::before { width: 8px; height: 8px; }
.marker.marker-city.pop-medium::before { width: 7px; height: 7px; }

.marker.marker-continent::before {
  width: 8px; height: 8px;
  background: #ff8800;
  box-shadow: 0 0 6px #ff8800, 0 0 12px rgba(255,136,0,0.4);
}

.marker.marker-ocean::before {
  width: 7px; height: 7px;
  background: #ff00ff;
  box-shadow: 0 0 6px #ff00ff, 0 0 12px rgba(255,0,255,0.4);
}

/* Selected marker ring */
.marker.selected::after {
  content: '';
  position: absolute;
  width: 20px; height: 20px;
  border: 1.5px solid rgba(255, 255, 255, 0.8);
  border-radius: 50%;
  animation: selectRing 1.5s ease-out infinite;
}

@keyframes selectRing {
  0% { transform: scale(0.8); opacity: 1; }
  100% { transform: scale(2); opacity: 0; }
}

/* ── Popup ── */
.popup {
  background: rgba(0, 0, 0, 0.85);
  color: #fff;
  border: 1px solid rgba(68, 136, 255, 0.5);
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 0.8rem;
  box-shadow: 0 0 16px rgba(68, 136, 255, 0.3);
  pointer-events: none;
  white-space: nowrap;
}

/* ── Detail Panel ── */
#detail-panel {
  position: fixed;
  right: -340px;
  top: 0;
  width: 340px;
  height: 100%;
  background: rgba(0, 5, 15, 0.92);
  border-left: 1px solid rgba(68, 136, 255, 0.3);
  z-index: 20;
  padding: 24px 20px;
  overflow-y: auto;
  transition: right 0.3s ease;
  color: #fff;
}

#detail-panel.open { right: 0; }

#panel-close {
  position: absolute;
  top: 12px;
  right: 14px;
  background: none;
  border: none;
  color: #88aacc;
  font-size: 1.4rem;
  cursor: pointer;
}

#panel-close:hover { color: #fff; }

.panel-flag { font-size: 3rem; margin-bottom: 8px; }
.panel-title { font-size: 1.3rem; font-weight: bold; color: #88ccff; margin-bottom: 4px; }
.panel-subtitle { font-size: 0.9rem; color: #aaa; margin-bottom: 16px; }

.panel-section {
  margin-bottom: 14px;
  padding-bottom: 14px;
  border-bottom: 1px solid rgba(68, 136, 255, 0.15);
}

.panel-label {
  font-size: 0.7rem;
  color: #668;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 4px;
}

.panel-value { font-size: 0.9rem; line-height: 1.5; }
.panel-time { font-size: 1.6rem; font-weight: 300; color: #88ccff; }

/* ── Time Slider ── */
#time-control {
  margin-top: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}

#time-slider {
  width: 140px;
  accent-color: #4488ff;
  cursor: pointer;
}

#time-label {
  font-size: 0.75rem;
  color: #88aacc;
  min-width: 90px;
}

#time-reset {
  background: none;
  border: 1px solid rgba(68, 136, 255, 0.3);
  color: #88aacc;
  border-radius: 3px;
  padding: 2px 8px;
  font-size: 0.7rem;
  cursor: pointer;
}

#time-reset:hover { border-color: rgba(68, 136, 255, 0.6); color: #fff; }

/* ── Route Info ── */
#route-info {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0, 10, 30, 0.9);
  border: 1px solid rgba(68, 136, 255, 0.4);
  border-radius: 8px;
  padding: 12px 20px;
  color: #fff;
  font-size: 0.9rem;
  z-index: 15;
  display: none;
  white-space: nowrap;
}

#route-info .route-cities { color: #88ccff; font-weight: bold; }
#route-info .route-distance { color: #ffcc44; margin: 0 12px; }
#route-info .route-time { color: #88ff88; }
#route-clear {
  background: none;
  border: none;
  color: #88aacc;
  font-size: 1.1rem;
  cursor: pointer;
  margin-left: 14px;
  vertical-align: middle;
}

/* ── Loading ── */
#loading {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
  z-index: 100;
  transition: opacity 0.5s;
}

#loading.hidden { opacity: 0; pointer-events: none; }

#loading span {
  color: #4488ff;
  font-size: 1.2rem;
  font-weight: 300;
  letter-spacing: 0.2em;
  text-shadow: 0 0 12px #4488ff;
}
</style>

<script id="earth-vertex" type="x-shader/x-vertex">
varying vec2 vUv;
varying vec3 vNormal;
varying vec3 vPosition;
void main() {
  vUv = uv;
  vNormal = normalize(normalMatrix * normal);
  vPosition = (modelViewMatrix * vec4(position, 1.0)).xyz;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}
</script>

<script id="earth-fragment" type="x-shader/x-fragment">
uniform sampler2D dayTexture;
uniform sampler2D nightTexture;
uniform sampler2D cloudsTexture;
uniform sampler2D specularTexture;
uniform vec3 lightDirection;
uniform float cloudOffset;
varying vec2 vUv;
varying vec3 vNormal;
varying vec3 vPosition;
void main() {
  vec3 normal = normalize(vNormal);
  vec3 viewDir = normalize(-vPosition);
  vec3 lightDir = normalize(lightDirection);
  float diffuse = dot(normal, lightDir);
  float blend = smoothstep(-0.1, 0.2, diffuse);
  vec3 dayColor = texture2D(dayTexture, vUv).rgb;
  vec3 nightColor = texture2D(nightTexture, vUv).rgb;
  vec3 color = mix(nightColor * 1.2, dayColor, blend);
  vec2 cloudUv = vUv + vec2(cloudOffset, 0.0);
  float cloud = texture2D(cloudsTexture, cloudUv).r;
  color = mix(color, vec3(1.0), cloud * blend * 0.6);
  float specMask = texture2D(specularTexture, vUv).r;
  vec3 halfDir = normalize(lightDir + viewDir);
  float spec = pow(max(dot(normal, halfDir), 0.0), 64.0);
  color += vec3(0.8, 0.85, 1.0) * spec * specMask * 0.5;
  float rim = 1.0 - dot(normal, viewDir);
  vec3 rimColor = vec3(0.267, 0.533, 1.0);
  color += rimColor * pow(rim, 3.0) * 0.6;
  gl_FragColor = vec4(color, 1.0);
}
</script>

<script id="atmo-vertex" type="x-shader/x-vertex">
varying vec3 vNormal;
varying vec3 vPosition;
void main() {
  vNormal = normalize(normalMatrix * normal);
  vPosition = (modelViewMatrix * vec4(position, 1.0)).xyz;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}
</script>

<script id="atmo-fragment" type="x-shader/x-fragment">
varying vec3 vNormal;
varying vec3 vPosition;
void main() {
  vec3 viewDir = normalize(-vPosition);
  float fresnel = 1.0 - dot(viewDir, vNormal);
  fresnel = pow(fresnel, 3.0);
  vec3 color = vec3(0.267, 0.533, 1.0);
  gl_FragColor = vec4(color, fresnel * 0.6);
}
</script>

// ============================================================
// Utilities
// ============================================================
function latLngToVector3(lat, lng, radius = 1.001) {
  const phi = (90 - lat) * Math.PI / 180, theta = (lng + 180) * Math.PI / 180;
  return new THREE.Vector3(-radius*Math.sin(phi)*Math.cos(theta), radius*Math.cos(phi), radius*Math.sin(phi)*Math.sin(theta));
}

function smoothstep(e0, e1, x) {
  const t = Math.max(0, Math.min(1, (x - e0) / (e1 - e0)));
  return t * t * (3 - 2 * t);
}

function haversine(lat1, lng1, lat2, lng2) {
  const R = 6371, toR = Math.PI / 180;
  const dLat = (lat2 - lat1) * toR, dLng = (lng2 - lng1) * toR;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*toR) * Math.cos(lat2*toR) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function getLocalTime(utcOffset) {
  const sim = getSimulatedUTC();
  const utc = sim.getTime() + sim.getTimezoneOffset() * 60000;
  return new Date(utc + utcOffset * 3600000).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
}

let timeOffsetMinutes = 0; // manual offset from slider (0 = real time)

function getSunDirection() {
  const now = new Date(Date.now() + timeOffsetMinutes * 60000);
  const hours = now.getUTCHours() + now.getUTCMinutes() / 60;
  const sunLng = (12 - hours) * 15;
  const dayOfYear = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000);
  const sunLat = 23.44 * Math.sin(2 * Math.PI / 365 * (dayOfYear - 81));
  return latLngToVector3(sunLat, sunLng, 5).normalize();
}

function getSimulatedUTC() {
  return new Date(Date.now() + timeOffsetMinutes * 60000);
}

function popSizeClass(popNum) {
  if (popNum >= 100000000) return 'pop-large';
  if (popNum >= 30000000) return 'pop-medium';
  return '';
}

// ============================================================
// Camera Animation
// ============================================================
let cameraAnimation = null;

function latLngToCamera(lat, lng, dist) {
  const phi = (90 - lat) * Math.PI / 180, theta = (lng + 180) * Math.PI / 180;
  return new THREE.Vector3(-dist*Math.sin(phi)*Math.cos(theta), dist*Math.cos(phi), dist*Math.sin(phi)*Math.sin(theta));
}

function animateCamera(lat, lng, dist, duration = 1000) {
  controls.autoRotate = false;
  cameraAnimation = { startPos: camera.position.clone(), endPos: latLngToCamera(lat, lng, dist), startTime: performance.now(), duration };
}

function updateCameraAnimation() {
  if (!cameraAnimation) return;
  const { startPos, endPos, startTime, duration } = cameraAnimation;
  const progress = Math.min((performance.now() - startTime) / duration, 1);
  const t = progress < 0.5 ? 4*progress**3 : 1 - (-2*progress + 2)**3 / 2;
  const sD = startPos.clone().normalize(), eD = endPos.clone().normalize();
  const dot = Math.max(-1, Math.min(1, sD.dot(eD)));
  const omega = Math.acos(dot);
  let newDir;
  if (omega < 0.001) { newDir = sD.clone().lerp(eD, t).normalize(); }
  else if (omega > Math.PI - 0.001) {
    const perp = new THREE.Vector3(0, 1, 0);
    if (Math.abs(sD.dot(perp)) > 0.9) perp.set(1, 0, 0);
    newDir = sD.clone().applyQuaternion(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3().crossVectors(sD, perp).normalize(), omega * t));
  } else {
    const s = Math.sin(omega), a = Math.sin((1-t)*omega)/s, b = Math.sin(t*omega)/s;
    newDir = sD.clone().multiplyScalar(a).add(eD.clone().multiplyScalar(b));
  }
  camera.position.copy(newDir.multiplyScalar(startPos.length() + (endPos.length() - startPos.length()) * t));
  camera.lookAt(0, 0, 0);
  if (progress >= 1) { cameraAnimation = null; controls.target.set(0,0,0); controls.update(); controls.autoRotate = true; }
}

let selectedCities = [];  // max 2

let arcStartTime = 0;
let earth = null; // set in init

function clearRoute() {
  selectedCities.forEach(s => s.markerEl.classList.remove('selected'));
  selectedCities = [];
  if (arcMesh) { earth.remove(arcMesh); arcMesh.geometry.dispose(); arcMesh.material.dispose(); arcMesh = null; }
  document.getElementById('route-info').style.display = 'none';
}

function createArcBetween(d1, d2) {
  const p1 = latLngToVector3(d1.lat, d1.lng);
  const p2 = latLngToVector3(d2.lat, d2.lng);
  const segments = 80;
  const points = [];
  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const p = new THREE.Vector3().lerpVectors(p1, p2, t).normalize();
    const elev = 1.005 + 0.06 * Math.sin(t * Math.PI);
    p.multiplyScalar(elev);
    points.push(p);
  }
  const geom = new THREE.BufferGeometry().setFromPoints(points);
  const mat = new THREE.LineBasicMaterial({ color: 0x44aaff, transparent: true, opacity: 0.9 });
  if (arcMesh) { earth.remove(arcMesh); arcMesh.geometry.dispose(); arcMesh.material.dispose(); }
  arcMesh = new THREE.Line(geom, mat);
  arcMesh.geometry.setDrawRange(0, 0);
  earth.add(arcMesh);
  arcStartTime = performance.now();

  // Show route info
  const dist = Math.round(haversine(d1.lat, d1.lng, d2.lat, d2.lng));
  const hours = (dist / 900).toFixed(1);
  document.getElementById('route-cities').textContent = `${d1.flag||''} ${d1.name} ↔ ${d2.flag||''} ${d2.name}`;
  document.getElementById('route-distance').textContent = `${dist.toLocaleString()} km`;
  document.getElementById('route-time').textContent = `約${hours}時間`;
  document.getElementById('route-info').style.display = 'block';
}

document.getElementById('route-clear').addEventListener('click', clearRoute);

}

// ============================================================
// State
// ============================================================
const markerObjects = [];
let activePopupObj = null;
let markerClickGuard = false;
let currentCategoryFilter = 'all';

const _worldPos = new THREE.Vector3();
const _markerNormal = new THREE.Vector3();
const _cameraDir = new THREE.Vector3();

// ============================================================
// Animate
// ============================================================
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  updateCameraAnimation();

  if (earthUniforms) {
    earthUniforms.cloudOffset.value += 0.00002;
    // Real-time sun position (with manual offset)
    earthUniforms.lightDirection.value.copy(getSunDirection());
  }

  // Spotlight pulse animation
  if (spotMesh.visible) {
    const pulse = 0.25 + Math.sin(performance.now() * 0.004) * 0.15;
    spotMat.opacity = pulse;
    const ringPulse = 0.15 + Math.sin(performance.now() * 0.003) * 0.1;
    spotRingMat.opacity = ringPulse;
    const scale = 1 + Math.sin(performance.now() * 0.002) * 0.15;
    spotRing.scale.setScalar(scale);
  }

  // Arc draw animation
  if (arcMesh) {
    const elapsed = (performance.now() - arcStartTime) / 1000;
    const progress = Math.min(elapsed / 1.2, 1);
    arcMesh.geometry.setDrawRange(0, Math.floor(progress * 81));
  }

  // Marker visibility
  const camPos = camera.position;
  const camDist = camPos.length();

  markerObjects.forEach(obj => {
    const data = obj.userData.data;
    obj.getWorldPosition(_worldPos);
    _markerNormal.copy(_worldPos).normalize();
    _cameraDir.copy(camPos).sub(_worldPos).normalize();
    const dot = _markerNormal.dot(_cameraDir);

    const backFace = dot > 0.05;
    const catOk = currentCategoryFilter === 'all' || data.type === currentCategoryFilter;
    // Zoom-based: hide cities when far, show progressively
    let zoomOk = true;
    if (data.type === 'city' && currentCategoryFilter === 'all') {
      if (camDist > 6) zoomOk = false;
      else if (camDist > 4.5 && (data.popNum || 0) < 50000000) zoomOk = false;
    }
    const visible = backFace && catOk && zoomOk;
    const opacity = smoothstep(0.05, 0.2, dot);

    obj.visible = visible;
    obj.userData.element.style.opacity = visible ? opacity : 0;

    const popupObj = obj.userData.popupObj;
    if (!visible && popupObj.visible) {
      popupObj.visible = false;
      if (activePopupObj === popupObj) activePopupObj = null;
    }
    if (popupObj.visible) popupObj.element.style.opacity = opacity;
  });

  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  if (!q) { searchResults.style.display = 'none'; return; }
  const matches = MARKERS.filter(m => m.name.toLowerCase().includes(q) || (m.country || '').toLowerCase().includes(q)).slice(0, 8);
  if (!matches.length) { searchResults.style.display = 'none'; return; }
  searchResults.innerHTML = matches.map((m, i) =>
    `<div class="search-item" data-idx="${MARKERS.indexOf(m)}">${m.flag || '🌍'} ${m.name}${m.country ? ' (' + m.country + ')' : ''}</div>`
  ).join('');
  searchResults.style.display = 'block';
});

searchResults.addEventListener('click', (e) => {
  const item = e.target.closest('.search-item');
  if (!item) return;
  const data = MARKERS[parseInt(item.dataset.idx)];
  animateCamera(data.lat, data.lng, 2.5);
  // Find and click the corresponding marker
  const obj = markerObjects.find(o => o.userData.data === data);
  if (obj) {
    if (activePopupObj) activePopupObj.visible = false;
    obj.userData.popupObj.visible = true;
    activePopupObj = obj.userData.popupObj;
    openPanel(data);
    moveSpotlight(data);
  }
  searchInput.value = '';
  searchResults.style.display = 'none';
});

searchInput.addEventListener('blur', () => { setTimeout(() => searchResults.style.display = 'none', 200); });

// Keyboard shortcut: / to focus search
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== searchInput) { e.preventDefault(); searchInput.focus(); }
  if (e.key === 'Escape') { closePanel(); clearRoute(); hideSpotlight(); searchInput.blur(); if (activePopupObj) { activePopupObj.visible = false; activePopupObj = null; } }
});

// Init
// ============================================================
async function init() {
  const loadingEl = document.getElementById('loading');
  loadingEl.querySelector('span').textContent = 'テクスチャを読み込み中...';

  const loadTex = (n, srgb = false) => textureLoader.loadAsync(TEXTURE_BASE + n).then(t => { if (srgb) t.colorSpace = THREE.SRGBColorSpace; return t; });
  const loadSafe = (n, srgb = false) => loadTex(n, srgb).catch(() => {
    const c = document.createElement('canvas'); c.width = c.height = 1; c.getContext('2d').fillRect(0,0,1,1); return new THREE.CanvasTexture(c);
  });

  const [dayMap, nightMap, cloudsMap, specMap] = await Promise.all([
    loadTex('earth_atmos_2048.jpg', true), loadTex('earth_lights_2048.png', true),
    loadSafe('earth_clouds_2048.png'), loadSafe('earth_specular_2048.png'),
  ]);

  loadingEl.querySelector('span').textContent = '地球を構築中...';

  earthUniforms = {
    dayTexture: { value: dayMap }, nightTexture: { value: nightMap },
    cloudsTexture: { value: cloudsMap }, specularTexture: { value: specMap },
    lightDirection: { value: getSunDirection() }, cloudOffset: { value: 0 },
  };

  earth = new THREE.Mesh(
    new THREE.SphereGeometry(1, 64, 64),
    new THREE.ShaderMaterial({
      vertexShader: document.getElementById('earth-vertex').textContent,
      fragmentShader: document.getElementById('earth-fragment').textContent,
      uniforms: earthUniforms,
    })
  );
  scene.add(earth);

  // Attach spotlight meshes to earth so they rotate with the globe
  earth.add(spotMesh);
  earth.add(spotRing);

  scene.add(new THREE.Mesh(
    new THREE.SphereGeometry(1.025, 64, 64),
    new THREE.ShaderMaterial({
      vertexShader: document.getElementById('atmo-vertex').textContent,
      fragmentShader: document.getElementById('atmo-fragment').textContent,
      side: THREE.BackSide, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false,
    })
  ));

  // ── Markers ──
  MARKERS.forEach(data => {
    const pos = latLngToVector3(data.lat, data.lng);

    const markerEl = document.createElement('div');
    let cls = `marker marker-${data.type}`;
    if (data.type === 'city' && data.popNum) cls += ' ' + popSizeClass(data.popNum);
    markerEl.className = cls;

    const markerObj = new CSS2DObject(markerEl);
    markerObj.position.copy(pos);
    earth.add(markerObj);

    // Simple popup label
    const popupEl = document.createElement('div');
    popupEl.className = 'popup';
    popupEl.textContent = data.flag ? `${data.flag} ${data.name}` : data.name;
    const popupObj = new CSS2DObject(popupEl);
    popupObj.position.copy(pos);
    popupObj.visible = false;
    earth.add(popupObj);

    markerObj.userData = { data, element: markerEl, popupObj };

    markerEl.addEventListener('click', (e) => {
      e.stopPropagation();
      markerClickGuard = true;

      // Route selection (city only)
      if (data.type === 'city') {
        const alreadySelected = selectedCities.findIndex(s => s.data === data);
        if (alreadySelected >= 0) {
          // Deselect
          markerEl.classList.remove('selected');
          selectedCities.splice(alreadySelected, 1);
          if (arcMesh) { clearRoute(); }
        } else if (selectedCities.length < 2) {
          markerEl.classList.add('selected');
          selectedCities.push({ data, markerEl });
          if (selectedCities.length === 2) {
            createArcBetween(selectedCities[0].data, selectedCities[1].data);
          }
        } else {
          clearRoute();
          markerEl.classList.add('selected');
          selectedCities.push({ data, markerEl });
        }
      }

      // Popup toggle
      if (activePopupObj === popupObj) {
        popupObj.visible = false;
        activePopupObj = null;
        closePanel();
        hideSpotlight();
      } else {
        if (activePopupObj) activePopupObj.visible = false;
        popupObj.visible = true;
        activePopupObj = popupObj;
        openPanel(data);
        moveSpotlight(data);
      }
    });

    markerObjects.push(markerObj);
  });

  // Background click
  renderer.domElement.addEventListener('click', () => {
    if (markerClickGuard) { markerClickGuard = false; return; }
    if (activePopupObj) { activePopupObj.visible = false; activePopupObj = null; closePanel(); hideSpotlight(); }
  });

  // ── UI ──
  document.getElementById('default-btn').addEventListener('click', () => {
    animateCamera(DEFAULT_CAMERA.lat, DEFAULT_CAMERA.lng, DEFAULT_CAMERA.distance);
    document.getElementById('region-select').value = '';
  });

  document.getElementById('region-select').addEventListener('change', (e) => {
    const r = REGIONS[e.target.value];
    if (r) animateCamera(r.lat, r.lng, r.distance);
  });

  document.getElementById('category-filter').addEventListener('change', (e) => {
    currentCategoryFilter = e.target.value;
    if (activePopupObj) { activePopupObj.visible = false; activePopupObj = null; closePanel(); hideSpotlight(); }
  });

  // ── Time Slider ──
  const timeSlider = document.getElementById('time-slider');
  const timeLabel = document.getElementById('time-label');

  // Set slider to current position (minutes since midnight UTC)
  const nowUTC = new Date();
  const currentMinutes = nowUTC.getUTCHours() * 60 + nowUTC.getUTCMinutes();
  timeSlider.value = currentMinutes;
  timeLabel.textContent = `UTC ${String(nowUTC.getUTCHours()).padStart(2,'0')}:${String(nowUTC.getUTCMinutes()).padStart(2,'0')}`;

  timeSlider.addEventListener('input', () => {
    const sliderMin = parseInt(timeSlider.value);
    // Calculate offset from current real time
    const realNow = new Date();
    const realMinutes = realNow.getUTCHours() * 60 + realNow.getUTCMinutes();
    timeOffsetMinutes = sliderMin - realMinutes;
    const simH = Math.floor(sliderMin / 60);
    const simM = sliderMin % 60;
    timeLabel.textContent = `UTC ${String(simH).padStart(2,'0')}:${String(simM).padStart(2,'0')}`;
  });

  document.getElementById('time-reset').addEventListener('click', () => {
    timeOffsetMinutes = 0;
    const n = new Date();
    const mins = n.getUTCHours() * 60 + n.getUTCMinutes();
    timeSlider.value = mins;
    timeLabel.textContent = `UTC ${String(n.getUTCHours()).padStart(2,'0')}:${String(n.getUTCMinutes()).padStart(2,'0')}`;
  });

  loadingEl.classList.add('hidden');
  animate();
}

init().catch(err => {
  console.error('Failed to initialize:', err);
  const el = document.getElementById('loading');
  const sp = el.querySelector('span');
  if (sp) sp.textContent = '読み込みエラー'; else el.textContent = '読み込みエラー';
});
</script>
</body>
</html>
