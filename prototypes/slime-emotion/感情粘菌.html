// =====================================================================
// EDGE GENERATION  — K 最近傍法
// =====================================================================
function genEdges(nodes, k) {
  k = k || 3;
  const edges = [], added = new Set();
  for (let i = 0; i < nodes.length; i++) {
    const dists = [];
    for (let j = 0; j < nodes.length; j++) {
      if (i === j) continue;
      const dx = nodes[i].x - nodes[j].x;
      const dy = nodes[i].y - nodes[j].y;
      dists.push({j, d: Math.sqrt(dx*dx + dy*dy)});
    }
    dists.sort((a,b) => a.d - b.d);
    for (let ki = 0; ki < Math.min(k, dists.length); ki++) {
      const j = dists[ki].j;
      const key = Math.min(i,j) + '-' + Math.max(i,j);
      if (!added.has(key)) {
        added.add(key);
        edges.push({a: nodes[i].id, b: nodes[j].id});
      }
    }
  }
  return edges;
}

// =====================================================================
// TREND LOOKUP （あいまいマッチング付き）
// =====================================================================
function getTrend(word) {
  const w = word.trim();
  if (TD[w]) return _finalize(TD[w]);
  for (const k of Object.keys(TD)) {
    if (w.includes(k) || k.includes(w)) return _finalize(TD[k]);
  }
  // Fallback: default mixed
  return _finalize({
    label: '"' + w + '" — 未知の感情地形',
    nodes: [
      {id:'n0', label:'未知への驚き',   emotion:'surprise', intensity:.80, x:.50, y:.15},
      {id:'n1', label:'変化への不安',   emotion:'fear',     intensity:.72, x:.25, y:.36},

      {id:'n5', label:'違和感',         emotion:'disgust',  intensity:.55, x:.50, y:.76},

}
function _finalize(d) {
  return {
    label: d.label,
    nodes: d.nodes.map(n => ({...n})),
    edges: genEdges(d.nodes, 3)
  };
}

// =====================================================================
// PHYSARUM TRANSPORT NETWORK (Tero et al., 2007)
// =====================================================================
class PhysarumNet {
  constructor() { this.nodes=[]; this.edges=[]; this.t=0; this.converged=false; }

  reset(nodes, edges) {
    this.nodes = nodes.map(n => ({...n, pressure:0}));
    this._idx  = {};
    this.nodes.forEach((n,i) => { this._idx[n.id] = i; });
    this.edges = edges.map(e => {
      const ai = this._idx[e.a], bi = this._idx[e.b];
      const na = this.nodes[ai],  nb = this.nodes[bi];
      const dx = na.x - nb.x, dy = na.y - nb.y;
      const L  = Math.sqrt(dx*dx + dy*dy) + 1e-4;
      return { a:e.a, b:e.b, ai, bi, L,
               D: 0.07 + Math.random()*0.06,  // randomised start
               Q: 0 };
    });
    this.t = 0;
    this.converged = false;
    this._maxD = 0;
  }

  step() {
    const N = this.nodes.length, Ed = this.edges, Nd = this.nodes;
    if (N < 2 || Ed.length === 0) return 0;

    // ─── Build Laplacian L ───
    const LAP = [];
    for (let i = 0; i < N; i++) LAP.push(new Float64Array(N));
    for (const e of Ed) {
      const C = e.D / e.L;
      LAP[e.ai][e.ai] += C;  LAP[e.bi][e.bi] += C;
      LAP[e.ai][e.bi] -= C;  LAP[e.bi][e.ai] -= C;
    }

    // ─── Source/sink vector (sum = 0) ───
    const mean = Nd.reduce((s,n) => s + n.intensity, 0) / N;
    const I    = Nd.map(n => n.intensity - mean);

    // ─── Remove row/col 0 (ground node) ───
    const n = N - 1;
    const A = Array.from({length:n}, (_,i) =>
                Array.from({length:n}, (_,j) => LAP[i+1][j+1]));
    const b = I.slice(1);

    // ─── Gauss-Jordan solve ───
    const p_sub = this._gjSolve(A, b);
    const p     = [0, ...p_sub];
    Nd.forEach((nd, i) => { nd.pressure = p[i] || 0; });

    // ─── Update conductivities ───
    const mu=1.8, dt=0.013, decay=1.5;
    let maxDelta = 0;
    for (const e of Ed) {
      const flow = Math.abs(e.D / e.L * (p[e.ai] - p[e.bi]));
      e.Q = flow;
      const fQ  = Math.pow(flow + 1e-9, mu);
      const nd  = Math.max(0.002, Math.min(5.0, e.D + dt*(fQ - decay*e.D)));
      maxDelta  = Math.max(maxDelta, Math.abs(nd - e.D));
      e.D = nd;
    }
    this.t++;
    this._maxD = maxDelta;
    if (maxDelta < 0.00008) this.converged = true;
    return maxDelta;
  }

  // Gauss-Jordan elimination (partial pivoting)
  _gjSolve(A, b) {
    const n = b.length;
    if (n === 0) return [];
    const M = A.map((r,i) => [...r, b[i]]);
    for (let p = 0; p < n; p++) {
      // Partial pivot
      let mr = p, mv = Math.abs(M[p][p]);
      for (let r = p+1; r < n; r++) {
        const v = Math.abs(M[r][p]);
        if (v > mv) { mv = v; mr = r; }
      }
      if (mr !== p) { const tmp=M[p]; M[p]=M[mr]; M[mr]=tmp; }
      const pv = M[p][p];
      if (Math.abs(pv) < 1e-12) continue;
      for (let j = p; j <= n; j++) M[p][j] /= pv;
      for (let r = 0; r < n; r++) {
        if (r === p) continue;
        const f = M[r][p];
        if (Math.abs(f) < 1e-14) continue;
        for (let j = p; j <= n; j++) M[r][j] -= f * M[p][j];
      }
    }
    return M.map(r => isFinite(r[n]) ? r[n] : 0);
  }

  getState() { return { nodes: this.nodes, edges: this.edges }; }
}

// =====================================================================
// CANVAS RENDERER
// =====================================================================
function hexRgb(hex) {
  const v = parseInt(hex.replace('#',''), 16);
  return { r:(v>>16)&255, g:(v>>8)&255, b:v&255 };
}

class Renderer {
  constructor(cv) {
    this.cv = cv;
    this.cx = cv.getContext('2d');
    this._resize();
    window.addEventListener('resize', () => this._resize());
  }
  _resize() {
    const dpr = window.devicePixelRatio || 1;
    const W = window.innerWidth, H = window.innerHeight;
    this.cv.width  = W * dpr;
    this.cv.height = H * dpr;
    this.cv.style.width  = W + 'px';
    this.cv.style.height = H + 'px';
    this.cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.W = W; this.H = H;
  }
  toScreen(x, y) {
    const pad = 0.10;
    return {
      sx: (pad + x*(1-2*pad)) * this.W,
      sy: (pad + y*(1-2*pad)) * this.H
    };
  }
  clear() {
    this.cx.fillStyle = '#0a0a0f';
    this.cx.fillRect(0, 0, this.W, this.H);
  }
  trail() {
    this.cx.fillStyle = 'rgba(10,10,15,0.16)';
    this.cx.fillRect(0, 0, this.W, this.H);
  }

  render(state, t) {
    if (!state) return;
    const c = this.cx;
    const {nodes, edges} = state;

    // Node screen positions
    const pm = {};
    for (const n of nodes) pm[n.id] = this.toScreen(n.x, n.y);

    // ─── Draw edges ───
    for (let i = 0; i < edges.length; i++) {
      const e = edges[i];
      const na = nodes.find(n => n.id === e.a);
      const nb = nodes.find(n => n.id === e.b);
      if (!na || !nb) continue;
      const pa = pm[e.a], pb = pm[e.b];
      if (!pa || !pb) continue;

      const dom   = na.intensity >= nb.intensity ? na : nb;
      const col   = EC[dom.emotion] || '#fff';
      const {r,g,b} = hexRgb(col);
      const pulse = Math.sin(t*0.055 + i*0.33)*0.18 + 0.82;
      const alpha = Math.min(1, e.D*2.5) * pulse;
      const w     = e.D * 14;
      if (w < 0.06 || alpha < 0.01) continue;

      // 3-layer bloom
      const layers = [
        {lw: w*5.5, a: alpha*0.035},
        {lw: w*2.2, a: alpha*0.13},
        {lw: w*0.85,a: alpha*0.85},
      ];
      for (const l of layers) {
        c.beginPath();
        c.moveTo(pa.sx, pa.sy);
        c.lineTo(pb.sx, pb.sy);
        c.strokeStyle = `rgba(${r},${g},${b},${l.a.toFixed(3)})`;
        c.lineWidth = l.lw;
        c.lineCap = 'round';
        c.stroke();
      }
    }

    // ─── Draw nodes ───
    for (const n of nodes) {
      const pos = pm[n.id]; if (!pos) continue;
      const col = EC[n.emotion] || '#fff';
      const {r,g,b} = hexRgb(col);
      const pulse  = Math.sin(t*0.04 + (n.id.charCodeAt(1)||0)*0.6)*0.14 + 0.86;
      const radius = (3.5 + n.intensity*13)*pulse;

      // Nebula glow
      const grd = c.createRadialGradient(pos.sx, pos.sy, 0, pos.sx, pos.sy, radius*5.5);
      grd.addColorStop(0, `rgba(${r},${g},${b},0.30)`);
      grd.addColorStop(1, `rgba(${r},${g},${b},0)`);
      c.beginPath();
      c.arc(pos.sx, pos.sy, radius*5.5, 0, Math.PI*2);
      c.fillStyle = grd; c.fill();

      // Core
      c.beginPath();
      c.arc(pos.sx, pos.sy, radius, 0, Math.PI*2);
      c.fillStyle = `rgba(${r},${g},${b},0.92)`;
      c.shadowColor = col; c.shadowBlur = 20;
      c.fill(); c.shadowBlur = 0;

      // Label
      if (n.intensity > 0.28) {
        c.font = `${Math.round(9 + n.intensity*4)}px sans-serif`;
        c.fillStyle = `rgba(255,255,255,${(n.intensity*0.68).toFixed(2)})`;
        c.textAlign = 'center';
        c.fillText(n.label, pos.sx, pos.sy + radius + 15);
      }
    }
  }
}

// =====================================================================
// APP CONTROLLER
// =====================================================================
class App {
  constructor() {
    this.cv       = document.getElementById('c');
    this.renderer = new Renderer(this.cv);
    this.ptn      = new PhysarumNet();
    this.state    = null;
    this.running  = false;
    this.frameT   = 0;
    this.maxSteps = 800;      // 収束上限ステップ数
    this.spf      = 6;        // steps-per-frame
    this._rafId   = null;
    this._buildUI();
    this.renderer.clear();
    this._idleLoop();
  }

  _buildUI() {
    // Legend
    const leg = document.getElementById('legend');
    for (const [k,v] of Object.entries(EL)) {
      const d = document.createElement('div');
      d.className = 'li';
      d.innerHTML =
        `<span class="ld" style="background:${EC[k]};box-shadow:0 0 6px ${EC[k]}"></span>${v}`;
      leg.appendChild(d);
    }
    // Chips
    const chips = document.getElementById('chips');
    for (const w of Object.keys(TD)) {
      const s = document.createElement('span');
      s.className = 'chip'; s.textContent = w;
      s.onclick = () => { document.getElementById('wordInput').value = w; this.observe(w); };
      chips.appendChild(s);
    }
    // Controls
    document.getElementById('submitBtn').onclick = () => {
      const w = document.getElementById('wordInput').value.trim();
      if (w) this.observe(w);
    };
    document.getElementById('wordInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const w = e.target.value.trim();
        if (w) this.observe(w);
      }
    });
  }

  setStatus(msg) { document.getElementById('status').textContent = msg; }
  setBar(pct)    { document.getElementById('stepBar').style.width = pct + '%'; }

  observe(word) {
    this.setStatus('— シミュレーション初期化中…');
    document.getElementById('bgLabel').textContent = word;
    const data = getTrend(word);
    this.state   = data;
    this.running = true;
    this.spf     = 6;
    this.ptn.reset(data.nodes, data.edges);
    this.renderer.clear();
    this.setStatus('— 粘菌が感情地形を探索中…');
    this.setBar(0);
    if (!this._rafId) this._loop();
  }

  _loop() {
    this._rafId = requestAnimationFrame(() => {
      this._rafId = null;
      this.frameT++;
      this.renderer.trail();

      if (this.running) {
        let md = 0;
        for (let i = 0; i < this.spf; i++) md = this.ptn.step();

        const s = this.ptn.getState();
        this.state = s;

        const progress = Math.min(100, (this.ptn.t / this.maxSteps) * 100);
        this.setBar(progress);

        if (this.ptn.converged || this.ptn.t >= this.maxSteps) {
          this.running = false;
          this.spf     = 1;
          this.setStatus(`— 収束完了 ✦  (${this.ptn.t} ステップ)`);
          this.setBar(100);
        } else {
          const mx = this.ptn.edges.reduce((m,e) => Math.max(m,e.D), 0);
          this.setStatus(`— 探索中… 最大伝導率: ${mx.toFixed(3)}  [${this.ptn.t} st]`);
        }
      }

      if (this.state) this.renderer.render(this.state, this.frameT);
      this._loop();
    });
  }

  // 待機中アニメーション（観察前）
  _idleLoop() {
    const driftNodes = [
      {id:'i0',emotion:'surprise',intensity:.5,x:.30,y:.30,pressure:0,label:''},
      {id:'i1',emotion:'fear',    intensity:.4,x:.70,y:.30,pressure:0,label:''},
      {id:'i2',emotion:'joy',     intensity:.6,x:.50,y:.60,pressure:0,label:''},
      {id:'i3',emotion:'sadness', intensity:.3,x:.22,y:.65,pressure:0,label:''},
      {id:'i4',emotion:'anger',   intensity:.4,x:.78,y:.65,pressure:0,label:''},
    ];
    let ft = 0;
    const idle = () => {
      if (this.running) { requestAnimationFrame(idle); return; }
      ft++;
      this.renderer.trail();
      for (let i = 0; i < driftNodes.length; i++) {
        const n = driftNodes[i];
        n.x = 0.28 + Math.sin(ft*0.008 + i*1.26) * 0.22 + (i%2===0 ? 0.17 : 0);
        n.y = 0.34 + Math.cos(ft*0.007 + i*0.9 ) * 0.24;
      }
      const c = this.renderer.cx;
      for (const n of driftNodes) {
        const pos = this.renderer.toScreen(n.x, n.y);
        const col = EC[n.emotion]; const {r,g,b} = hexRgb(col);
        const pulse = Math.sin(ft*0.04 + driftNodes.indexOf(n)*0.7)*0.20 + 0.80;
        const rad   = 5 + n.intensity*16*pulse;
        const grd = c.createRadialGradient(pos.sx,pos.sy,0,pos.sx,pos.sy,rad*7);
        grd.addColorStop(0,`rgba(${r},${g},${b},0.14)`);
        grd.addColorStop(1,`rgba(${r},${g},${b},0)`);
        c.beginPath(); c.arc(pos.sx,pos.sy,rad*7,0,Math.PI*2);
        c.fillStyle=grd; c.fill();
        c.beginPath(); c.arc(pos.sx,pos.sy,rad*0.45,0,Math.PI*2);
        c.fillStyle=`rgba(${r},${g},${b},0.55)`;
        c.shadowColor=col; c.shadowBlur=14; c.fill(); c.shadowBlur=0;
      }
      requestAnimationFrame(idle);
    };
    requestAnimationFrame(idle);
  }
}

// =====================================================================
// BOOT
// =====================================================================
window.addEventListener('DOMContentLoaded', () => { new App(); });
</script>
